schema_version: 1
id: execution-fabric-portable-deployment
owner: genomes_agentic_os
deploy_root: deploy/execution-fabric
installer_root: installers/execution-fabric
canonical_instance_config: harness/config/execution-fabric.yml
platforms:
  linux:
    installer: installers/execution-fabric/install-linux.sh
    activator: installers/execution-fabric/activate-linux.sh
    service_manager: systemd
    role: primary
  macos:
    installer: installers/execution-fabric/install-macos.sh
    activator: installers/execution-fabric/activate-macos.sh
    service_manager: launchd
    role: warm_standby
  kubernetes:
    installer: deploy/execution-fabric/helm/los-agents
    service_manager: helm
    role: worker
  oci_witness:
    installer: installers/execution-fabric/install-witness.sh
    activator: installers/execution-fabric/activate-witness.sh
    service_manager: docker_or_podman
    role: independent_leadership_witness
runtime_contract:
  api_version: v1
  immutable_images_required: true
  secrets_in_source: false
  automatic_failback: false
  leadership_api_required_for_promotion: true
  witness_activation_requires_operator: true
  witness_default_platform: oci_witness
  witness_no_independent_host_mode: manual_fail_closed
  personal_primary_authority: standalone_primary
  personal_primary_is_ha: false
  personal_primary_promotion_allowed: false
  two_host_split_brain_safe_without_witness: false
  artifact_replication_mode: active_active_single_writer
  artifact_replication_receipt_required_for_promotion: true
  host_worker_executable: installers/execution-fabric/bin/python-worker.sh
