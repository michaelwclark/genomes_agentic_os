AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Independent, digest-pinned Execution Fabric leadership witness on ECS
  Fargate with DynamoDB conditional leadership state.

Parameters:
  EnvironmentName:
    Type: String
    Default: execution-fabric-witness
    AllowedPattern: "^[a-zA-Z0-9-]{3,48}$"
  ClusterId:
    Type: String
    AllowedPattern: "^[a-zA-Z0-9._-]{1,128}$"
  InitialLeader:
    Type: String
    Default: genomesbox
    AllowedPattern: "^[a-zA-Z0-9._-]{1,128}$"
  InitialTimelineId:
    Type: Number
    Default: 1
    MinValue: 1
  InitialConfigDigest:
    Type: String
    AllowedPattern: "^[a-f0-9]{64}$"
  WitnessImage:
    Type: String
    Description: OCI image reference pinned with @sha256.
    AllowedPattern: "^.+@sha256:[a-f0-9]{64}$"
  SecretBootstrapImage:
    Type: String
    Description: AWS CLI image reference pinned with @sha256.
    AllowedPattern: "^.+@sha256:[a-f0-9]{64}$"
  EcsClusterArn:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  ServiceSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  ServiceSecurityGroups:
    Type: List<AWS::EC2::SecurityGroup::Id>
  LoadBalancerSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  LoadBalancerSecurityGroups:
    Type: List<AWS::EC2::SecurityGroup::Id>
  CertificateArn:
    Type: String
    Description: ACM certificate for the witness HTTPS endpoint.
  AdminTokenSecretArn:
    Type: String
    Description: Secrets Manager ARN containing only the admin bearer token.
  ReaderTokenSecretArn:
    Type: String
    Description: Secrets Manager ARN containing only the read-only status bearer token.
  CandidateTokensSecretArn:
    Type: String
    Description: Secrets Manager ARN containing a JSON object of host id to unique candidate bearer token.
  SigningPrivateKeySecretArn:
    Type: String
    Description: Secrets Manager ARN containing the Ed25519 PKCS8 signing private key.
  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 6
  MaxReplicaLagBytes:
    Type: Number
    Default: 67108864
    MinValue: 0
  CandidateFreshnessSeconds:
    Type: Number
    Default: 90
    MinValue: 15
    MaxValue: 3600
  LeaderBaselineMaxAgeSeconds:
    Type: Number
    Default: 300
    MinValue: 30
    MaxValue: 86400
  AllowDegradedPrimary:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  MaxDegradedPrimarySeconds:
    Type: Number
    Default: 3600
    MinValue: 60
    MaxValue: 86400
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: >-
      Optional existing SNS topic ARN for witness alarm and recovery actions.
      Leave empty to keep alarms local to CloudWatch or create a managed topic.
    AllowedPattern: "^$|^arn:[a-z0-9-]+:sns:[a-z0-9-]+:[0-9]{12}:.+$"
  CreateAlarmTopic:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Create an unsubscribed, stack-managed SNS topic when AlarmTopicArn is
      empty. Subscriptions remain an explicit operator action.

Conditions:
  HasProvidedAlarmTopic: !Not
    - !Equals [!Ref AlarmTopicArn, ""]
  CreateManagedAlarmTopic: !And
    - !Equals [!Ref CreateAlarmTopic, "true"]
    - !Equals [!Ref AlarmTopicArn, ""]
  HasAlarmDestination: !Or
    - !Condition HasProvidedAlarmTopic
    - !Condition CreateManagedAlarmTopic

Resources:
  WitnessAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: CreateManagedAlarmTopic
    Properties:
      TopicName: !Sub "${EnvironmentName}-alarms"
      KmsMasterKeyId: alias/aws/sns
      Tags:
        - Key: system
          Value: genomes-agentic-os
        - Key: component
          Value: execution-fabric-leadership-witness

  WitnessAlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: CreateManagedAlarmTopic
    Properties:
      Topics:
        - !Ref WitnessAlarmTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudWatchAlarmPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref WitnessAlarmTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                AWS:SourceArn: !Sub >-
                  arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${EnvironmentName}-*

  WitnessTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${EnvironmentName}-leadership"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: system
          Value: genomes-agentic-os
        - Key: component
          Value: execution-fabric-leadership-witness

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/genomes-agentic-os/${EnvironmentName}"
      RetentionInDays: 90

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: witness-state-and-secret-bootstrap
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                Resource: !GetAtt WitnessTable.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref AdminTokenSecretArn
                  - !Ref ReaderTokenSecretArn
                  - !Ref CandidateTokensSecretArn
                  - !Ref SigningPrivateKeySecretArn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-service"
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: witness-secrets
      ContainerDefinitions:
        - Name: secret-bootstrap
          Image: !Ref SecretBootstrapImage
          Essential: false
          EntryPoint:
            - sh
            - -ec
          Command:
            - >-
              umask 077;
              aws secretsmanager get-secret-value --secret-id "$ADMIN_SECRET_ARN"
              --query SecretString --output text > /run/witness-secrets/admin-token;
              aws secretsmanager get-secret-value --secret-id "$READER_SECRET_ARN"
              --query SecretString --output text > /run/witness-secrets/reader-token;
              aws secretsmanager get-secret-value --secret-id "$CANDIDATE_TOKENS_SECRET_ARN"
              --query SecretString --output text > /run/witness-secrets/candidate-tokens.json;
              aws secretsmanager get-secret-value --secret-id "$SIGNING_PRIVATE_KEY_SECRET_ARN"
              --query SecretString --output text > /run/witness-secrets/signing-private-key.pem;
              chmod 0444 /run/witness-secrets/admin-token /run/witness-secrets/reader-token
              /run/witness-secrets/candidate-tokens.json /run/witness-secrets/signing-private-key.pem
          Environment:
            - Name: ADMIN_SECRET_ARN
              Value: !Ref AdminTokenSecretArn
            - Name: READER_SECRET_ARN
              Value: !Ref ReaderTokenSecretArn
            - Name: CANDIDATE_TOKENS_SECRET_ARN
              Value: !Ref CandidateTokensSecretArn
            - Name: SIGNING_PRIVATE_KEY_SECRET_ARN
              Value: !Ref SigningPrivateKeySecretArn
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          MountPoints:
            - SourceVolume: witness-secrets
              ContainerPath: /run/witness-secrets
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: bootstrap
        - Name: witness
          Image: !Ref WitnessImage
          Essential: true
          DependsOn:
            - ContainerName: secret-bootstrap
              Condition: SUCCESS
          PortMappings:
            - ContainerPort: 3195
              Protocol: tcp
          Environment:
            - Name: WITNESS_BIND_IP
              Value: 0.0.0.0
            - Name: WITNESS_PORT
              Value: "3195"
            - Name: WITNESS_HOST_ID
              Value: !Sub "${EnvironmentName}-aws-witness"
            - Name: WITNESS_CLUSTER_ID
              Value: !Ref ClusterId
            - Name: WITNESS_STORE
              Value: dynamodb
            - Name: WITNESS_TABLE_NAME
              Value: !Ref WitnessTable
            - Name: WITNESS_INITIAL_LEADER
              Value: !Ref InitialLeader
            - Name: WITNESS_INITIAL_TIMELINE_ID
              Value: !Ref InitialTimelineId
            - Name: WITNESS_INITIAL_CONFIG_DIGEST
              Value: !Ref InitialConfigDigest
            - Name: WITNESS_MAX_REPLICA_LAG_BYTES
              Value: !Ref MaxReplicaLagBytes
            - Name: WITNESS_CANDIDATE_FRESHNESS_SECONDS
              Value: !Ref CandidateFreshnessSeconds
            - Name: WITNESS_LEADER_BASELINE_MAX_AGE_SECONDS
              Value: !Ref LeaderBaselineMaxAgeSeconds
            - Name: WITNESS_ALLOW_DEGRADED_PRIMARY
              Value: !Ref AllowDegradedPrimary
            - Name: WITNESS_MAX_DEGRADED_PRIMARY_SECONDS
              Value: !Ref MaxDegradedPrimarySeconds
            - Name: WITNESS_ADMIN_TOKEN_FILE
              Value: /run/witness-secrets/admin-token
            - Name: WITNESS_READER_TOKEN_FILE
              Value: /run/witness-secrets/reader-token
            - Name: WITNESS_CANDIDATE_TOKENS_FILE
              Value: /run/witness-secrets/candidate-tokens.json
            - Name: WITNESS_SIGNING_PRIVATE_KEY_FILE
              Value: /run/witness-secrets/signing-private-key.pem
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          MountPoints:
            - SourceVolume: witness-secrets
              ContainerPath: /run/witness-secrets
              ReadOnly: true
          HealthCheck:
            Command:
              - CMD-SHELL
              - >-
                node -e "fetch('http://127.0.0.1:3195/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: witness

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: !Ref LoadBalancerSubnets
      SecurityGroups: !Ref LoadBalancerSecurityGroups
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: "true"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 3195
      HealthCheckEnabled: true
      HealthCheckPath: /readyz
      Matcher:
        HttpCode: "200"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - Listener
    Properties:
      Cluster: !Ref EcsClusterArn
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref ServiceSubnets
          SecurityGroups: !Ref ServiceSecurityGroups
      LoadBalancers:
        - ContainerName: witness
          ContainerPort: 3195
          TargetGroupArn: !Ref TargetGroup

  WitnessRunningTaskCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-ecs-running-task-count"
      AlarmDescription: Witness ECS running task count is below DesiredCount.
      Namespace: ECS/ContainerInsights
      MetricName: RunningTaskCount
      Dimensions:
        - Name: ClusterName
          Value: !Select [1, !Split ["/", !Ref EcsClusterArn]]
        - Name: ServiceName
          Value: !GetAtt Service.Name
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: !Ref DesiredCount
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue
      OKActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue
      InsufficientDataActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue

  WitnessUnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-alb-unhealthy-targets"
      AlarmDescription: One or more witness ALB targets are unhealthy.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue
      OKActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue

  WitnessAlb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-alb-5xx"
      AlarmDescription: Witness ALB generated HTTP 5xx responses.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue
      OKActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue

  WitnessTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-target-5xx"
      AlarmDescription: Witness targets returned HTTP 5xx responses.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue
      OKActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue

  WitnessReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-dynamodb-read-throttles"
      AlarmDescription: Witness DynamoDB table read requests were throttled.
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref WitnessTable
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue
      OKActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue

  WitnessWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-dynamodb-write-throttles"
      AlarmDescription: Witness DynamoDB table write requests were throttled.
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref WitnessTable
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue
      OKActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue

  WitnessDynamoSystemErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-dynamodb-system-errors"
      AlarmDescription: Witness DynamoDB API operations returned system errors.
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: systemErrors
          Label: DynamoDB witness system errors
          Expression: getErrors + putErrors + queryErrors + transactErrors
          ReturnData: true
        - Id: getErrors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref WitnessTable
                - Name: Operation
                  Value: GetItem
            Period: 60
            Stat: Sum
        - Id: putErrors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref WitnessTable
                - Name: Operation
                  Value: PutItem
            Period: 60
            Stat: Sum
        - Id: queryErrors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref WitnessTable
                - Name: Operation
                  Value: Query
            Period: 60
            Stat: Sum
        - Id: transactErrors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref WitnessTable
                - Name: Operation
                  Value: TransactWriteItems
            Period: 60
            Stat: Sum
      AlarmActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue
      OKActions: !If
        - HasProvidedAlarmTopic
        - [!Ref AlarmTopicArn]
        - !If
          - CreateManagedAlarmTopic
          - [!Ref WitnessAlarmTopic]
          - !Ref AWS::NoValue

Outputs:
  WitnessTableName:
    Value: !Ref WitnessTable
  WitnessTableArn:
    Value: !GetAtt WitnessTable.Arn
  WitnessHttpsBase:
    Value: !Sub "https://${LoadBalancer.DNSName}"
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  WitnessAlarmTopicArn:
    Condition: HasAlarmDestination
    Description: Existing or stack-managed SNS topic used by witness alarms.
    Value: !If
      - HasProvidedAlarmTopic
      - !Ref AlarmTopicArn
      - !Ref WitnessAlarmTopic
  WitnessAlarmNames:
    Description: CloudWatch alarms installed for the witness control plane.
    Value: !Join
      - ","
      - - !Ref WitnessRunningTaskCountAlarm
        - !Ref WitnessUnhealthyTargetsAlarm
        - !Ref WitnessAlb5xxAlarm
        - !Ref WitnessTarget5xxAlarm
        - !Ref WitnessReadThrottleAlarm
        - !Ref WitnessWriteThrottleAlarm
        - !Ref WitnessDynamoSystemErrorsAlarm
