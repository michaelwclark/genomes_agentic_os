listen_addresses = '*'
port = 5432
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = 'scram-sha-256'
ssl = off
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = '2GB'
# Bootstrap and post-promotion start deliberately asynchronous. The mutation
# plane remains fenced until enable-postgres-durable-primary.sh verifies a
# streaming standby, enables remote_apply, and writes a read-back receipt.
synchronous_commit = 'local'
synchronous_standby_names = ''
archive_mode = on
archive_command = 'test -f /var/backups/postgresql/%f || cp %p /var/backups/postgresql/%f'
archive_timeout = '60s'
hot_standby = on
track_commit_timestamp = on
log_connections = on
log_disconnections = on
log_min_duration_statement = 1000
shared_buffers = '256MB'
max_connections = 100
