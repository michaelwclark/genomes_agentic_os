name: Verified MinIO source image checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: inputs
        name: Verify official pinned source, payloads and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/prepare-minio-build-inputs.py --output-dir .minio-build-context
          python - <<'PY'
          import json, os
          inputs = json.load(open('.minio-build-context/build-inputs.json'))
          assert inputs['status'] == 'verified'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('base_image=' + inputs['base_image'] + '\n')
          PY
      - name: Build actual server image for this architecture
        uses: docker/build-push-action@v6
        with:
          context: .minio-build-context
          file: .minio-build-context/Dockerfile
          target: minio
          platforms: linux/${{ matrix.arch }}
          build-args: BASE_IMAGE=${{ steps.inputs.outputs.base_image }}
          load: true
          push: false
          provenance: false
          tags: minio-source-server:${{ github.sha }}-${{ matrix.arch }}
      - name: Build actual client image for this architecture
        uses: docker/build-push-action@v6
        with:
          context: .minio-build-context
          file: .minio-build-context/Dockerfile
          target: minio-client
          platforms: linux/${{ matrix.arch }}
          build-args: BASE_IMAGE=${{ steps.inputs.outputs.base_image }}
          load: true
          push: false
          provenance: false
          tags: minio-source-client:${{ github.sha }}-${{ matrix.arch }}
      - name: Exercise real bytes, health, credentials, object operations and restart
        run: |
          python scripts/release/smoke-minio-source-images.py \
            --platform linux/${{ matrix.arch }} \
            --minio-image minio-source-server:${{ github.sha }}-${{ matrix.arch }} \
            --client-image minio-source-client:${{ github.sha }}-${{ matrix.arch }} \
            --namespace minio-source-${{ github.run_id }}-${{ matrix.arch }} \
            --output minio-smoke-${{ matrix.arch }}.json
      - name: Exercise published amd64 then arm64 in one Docker store
        if: matrix.arch == 'amd64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/smoke-minio-source-images.py \
            --published-fixture tests/fixtures/minio_published_transport_v0_11_1.json \
            --namespace minio-source-published-${{ github.run_id }}-${{ github.run_attempt }} \
            --output minio-published-transport/regression.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: minio-source-image-proof-${{ matrix.arch }}
          include-hidden-files: true
          path: |
            .minio-build-context/build-inputs.json
            minio-smoke-${{ matrix.arch }}.json
            minio-published-transport/**
          if-no-files-found: warn
