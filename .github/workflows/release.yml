name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gates:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  validate:
    needs: quality-gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Require the tagged commit to be reachable from main
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - run: python -m pip install -e .
      - id: version
        name: Validate tag and release contract
        run: |
          python scripts/release/build-execution-fabric-release.py --validate-only
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  dependency-images:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.resolve.outputs.postgres }}
      valkey: ${{ steps.resolve.outputs.valkey }}
      minio: ${{ steps.resolve.outputs.minio }}
      minio_client: ${{ steps.resolve.outputs.minio_client }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: docker/setup-buildx-action@v3
      - id: resolve
        name: Resolve reviewed dependency tags to multi-arch index digests
        run: |
          python <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess


          source_path = Path("deploy/execution-fabric/release-image-sources.json")
          source_manifest = json.loads(source_path.read_text(encoding="utf-8"))
          expected_names = ("postgres", "valkey", "minio", "minio_client")
          if source_manifest.get("schema_version") != "execution-fabric-release-image-sources/v1":
              raise SystemExit("unsupported dependency image source schema")
          sources = source_manifest.get("images")
          if not isinstance(sources, dict) or set(sources) != set(expected_names):
              raise SystemExit("dependency image source manifest is incomplete")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              for name in expected_names:
                  entry = sources[name]
                  if not isinstance(entry, dict) or set(entry) != {"repository", "tag"}:
                      raise SystemExit(f"invalid dependency image source: {name}")
                  repository = entry["repository"]
                  tag = entry["tag"]
                  source = f"{repository}:{tag}"
                  result = subprocess.run(
                      [
                          "docker",
                          "buildx",
                          "imagetools",
                          "inspect",
                          "--format",
                          "{{json .Manifest}}",
                          source,
                      ],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  descriptor = json.loads(result.stdout)
                  if descriptor.get("mediaType") not in {
                      "application/vnd.oci.image.index.v1+json",
                      "application/vnd.docker.distribution.manifest.list.v2+json",
                  }:
                      raise SystemExit(f"{source} is not a multi-arch image index")
                  manifests = descriptor.get("manifests")
                  if not isinstance(manifests, list) or not manifests:
                      raise SystemExit(f"{source} has no indexed platform manifests")
                  platforms = {
                      f"{platform.get('os')}/{platform.get('architecture')}"
                      for item in manifests
                      if isinstance(item, dict)
                      and isinstance((platform := item.get("platform")), dict)
                  }
                  required_platforms = {"linux/amd64", "linux/arm64"}
                  if not required_platforms.issubset(platforms):
                      raise SystemExit(
                          f"{source} lacks required platforms: "
                          + ", ".join(sorted(required_platforms - platforms))
                      )
                  digest = descriptor.get("digest")
                  if (
                      not isinstance(digest, str)
                      or not digest.startswith("sha256:")
                      or len(digest) != 71
                      or any(character not in "0123456789abcdef" for character in digest[7:])
                  ):
                      raise SystemExit(f"{source} returned an invalid index digest")
                  exact_reference = f"{repository}@{digest}"
                  fingerprint = hashlib.sha256(exact_reference.encode()).hexdigest()
                  print(f"resolved {name} index {fingerprint[:12]}")
                  output.write(f"{name}={exact_reference}\n")
          PY

  control-plane-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: services/execution-fabric-control-plane
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-control-plane:${{ needs.validate.outputs.version }}
          platforms: linux/amd64,linux/arm64
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-control-plane
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  witness-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: services/execution-fabric-leadership-witness
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-leadership-witness:${{ needs.validate.outputs.version }}
          platforms: linux/amd64,linux/arm64
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-leadership-witness
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  worker-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/execution-fabric-worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-worker:${{ needs.validate.outputs.version }}
          platforms: linux/amd64,linux/arm64
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-worker
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  assets:
    needs: [validate, dependency-images, control-plane-image, witness-image, worker-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e . build
      - name: Build Python distributions and digest-locked portable assets
        run: |
          python -m build
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          python scripts/release/build-execution-fabric-release.py \
            --output-dir dist/release \
            --control-plane-image "ghcr.io/${owner}/genomes-agentic-os-execution-fabric-control-plane@${{ needs.control-plane-image.outputs.digest }}" \
            --witness-image "ghcr.io/${owner}/genomes-agentic-os-execution-fabric-leadership-witness@${{ needs.witness-image.outputs.digest }}" \
            --worker-image "ghcr.io/${owner}/genomes-agentic-os-execution-fabric-worker@${{ needs.worker-image.outputs.digest }}" \
            --postgres-image "${{ needs.dependency-images.outputs.postgres }}" \
            --valkey-image "${{ needs.dependency-images.outputs.valkey }}" \
            --minio-image "${{ needs.dependency-images.outputs.minio }}" \
            --minio-client-image "${{ needs.dependency-images.outputs.minio_client }}"
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/release/execution-fabric-sbom.spdx.json
          upload-artifact: false
      - name: Refresh checksums after SBOM
        working-directory: dist/release
        run: |
          cp ../*.whl ../*.tar.gz ./
          rm SHA256SUMS
          checksum_tmp="$(mktemp "${RUNNER_TEMP}/execution-fabric-SHA256SUMS.XXXXXX")"
          trap 'rm -f "${checksum_tmp}"' EXIT
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
            sort -z |
            xargs -0 sha256sum > "${checksum_tmp}"
          mv "${checksum_tmp}" SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: execution-fabric-release-assets
          path: dist/release/*
          if-no-files-found: error

  github-release:
    needs: [validate, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: execution-fabric-release-assets
          path: dist/release
      - name: Create the one immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; refusing to replace immutable assets" >&2
            exit 73
          fi
          gh release create "${TAG}" dist/release/* --verify-tag --generate-notes --title "${TAG}"
