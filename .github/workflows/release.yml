name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gates:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  validate:
    needs: quality-gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e .
      - id: version
        name: Validate tag and release contract
        run: |
          python scripts/release/build-execution-fabric-release.py --validate-only
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  control-plane-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: services/execution-fabric-control-plane
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-control-plane:${{ needs.validate.outputs.version }}
          platforms: linux/amd64,linux/arm64
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-control-plane
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  witness-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: services/execution-fabric-leadership-witness
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-leadership-witness:${{ needs.validate.outputs.version }}
          platforms: linux/amd64,linux/arm64
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-leadership-witness
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  worker-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/execution-fabric-worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-worker:${{ needs.validate.outputs.version }}
          platforms: linux/amd64,linux/arm64
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-worker
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  assets:
    needs: [validate, control-plane-image, witness-image, worker-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e . build
      - name: Build Python distributions and digest-locked portable assets
        run: |
          python -m build
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          python scripts/release/build-execution-fabric-release.py \
            --output-dir dist/release \
            --control-plane-image "ghcr.io/${owner}/genomes-agentic-os-execution-fabric-control-plane@${{ needs.control-plane-image.outputs.digest }}" \
            --witness-image "ghcr.io/${owner}/genomes-agentic-os-execution-fabric-leadership-witness@${{ needs.witness-image.outputs.digest }}" \
            --worker-image "ghcr.io/${owner}/genomes-agentic-os-execution-fabric-worker@${{ needs.worker-image.outputs.digest }}"
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/release/execution-fabric-sbom.spdx.json
          upload-artifact: false
      - name: Refresh checksums after SBOM
        working-directory: dist/release
        run: |
          cp ../*.whl ../*.tar.gz ./
          rm SHA256SUMS
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
            sort -z |
            xargs -0 sha256sum > SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: execution-fabric-release-assets
          path: dist/release/*
          if-no-files-found: error

  github-release:
    needs: [validate, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: execution-fabric-release-assets
          path: dist/release
      - name: Create or refresh the one GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/release/* --clobber
          else
            gh release create "${TAG}" dist/release/* --verify-tag --generate-notes --title "${TAG}"
          fi
