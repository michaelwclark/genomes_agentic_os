name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gates:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  validate:
    needs: quality-gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Require the tagged commit to be reachable from main
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - run: python -m pip install -e .
      - id: version
        name: Validate tag and release contract
        run: |
          python scripts/release/build-execution-fabric-release.py --validate-only
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          python scripts/release/release-contract.py --validate-stable-version "${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  dependency-images:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.resolve.outputs.postgres }}
      valkey: ${{ steps.resolve.outputs.valkey }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: docker/setup-buildx-action@v3
      - id: resolve
        name: Resolve reviewed dependency tags to multi-arch index digests
        run: |
          python <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess


          source_path = Path("deploy/execution-fabric/release-image-sources.json")
          source_manifest = json.loads(source_path.read_text(encoding="utf-8"))
          expected_names = ("postgres", "valkey", "minio", "minio_client")
          if source_manifest.get("schema_version") != "execution-fabric-release-image-sources/v1":
              raise SystemExit("unsupported dependency image source schema")
          sources = source_manifest.get("images")
          if not isinstance(sources, dict) or set(sources) != set(expected_names):
              raise SystemExit("dependency image source manifest is incomplete")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              for name in ("postgres", "valkey"):
                  entry = sources[name]
                  if not isinstance(entry, dict) or set(entry) != {"repository", "tag"}:
                      raise SystemExit(f"invalid dependency image source: {name}")
                  repository = entry["repository"]
                  tag = entry["tag"]
                  source = f"{repository}:{tag}"
                  result = subprocess.run(
                      [
                          "docker",
                          "buildx",
                          "imagetools",
                          "inspect",
                          "--format",
                          "{{json .Manifest}}",
                          source,
                      ],
                      check=False,
                      capture_output=True,
                      text=True,
                  )
                  if result.returncode:
                      raise SystemExit(f"{source} index lookup failed: {result.stderr.strip()[:1600]}")
                  descriptor = json.loads(result.stdout)
                  if descriptor.get("mediaType") not in {
                      "application/vnd.oci.image.index.v1+json",
                      "application/vnd.docker.distribution.manifest.list.v2+json",
                  }:
                      raise SystemExit(f"{source} is not a multi-arch image index")
                  manifests = descriptor.get("manifests")
                  if not isinstance(manifests, list) or not manifests:
                      raise SystemExit(f"{source} has no indexed platform manifests")
                  platforms = {
                      f"{platform.get('os')}/{platform.get('architecture')}"
                      for item in manifests
                      if isinstance(item, dict)
                      and isinstance((platform := item.get("platform")), dict)
                  }
                  required_platforms = {"linux/amd64", "linux/arm64"}
                  if not required_platforms.issubset(platforms):
                      raise SystemExit(
                          f"{source} lacks required platforms: "
                          + ", ".join(sorted(required_platforms - platforms))
                      )
                  digest = descriptor.get("digest")
                  if (
                      not isinstance(digest, str)
                      or not digest.startswith("sha256:")
                      or len(digest) != 71
                      or any(character not in "0123456789abcdef" for character in digest[7:])
                  ):
                      raise SystemExit(f"{source} returned an invalid index digest")
                  exact_reference = f"{repository}@{digest}"
                  fingerprint = hashlib.sha256(exact_reference.encode()).hexdigest()
                  print(f"resolved {name} index {fingerprint[:12]}")
                  output.write(f"{name}={exact_reference}\n")
          PY

  minio-images:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      minio: ghcr.io/michaelwclark/genomes-agentic-os-execution-fabric-minio@${{ steps.server.outputs.digest }}
      minio_client: ghcr.io/michaelwclark/genomes-agentic-os-execution-fabric-minio-client@${{ steps.client.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: inputs
        name: Verify same-release official source and signed payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/prepare-minio-build-inputs.py --output-dir .minio-build-context
          python - <<'PY'
          import json, os
          inputs = json.load(open('.minio-build-context/build-inputs.json'))
          assert inputs['status'] == 'verified'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('base_image=' + inputs['base_image'] + '\n')
          PY
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: server
        name: Publish verified same-release MinIO index
        uses: docker/build-push-action@v6
        with:
          context: .minio-build-context
          file: .minio-build-context/Dockerfile
          target: minio
          platforms: linux/amd64,linux/arm64
          build-args: BASE_IMAGE=${{ steps.inputs.outputs.base_image }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/michaelwclark/genomes-agentic-os-execution-fabric-minio:${{ github.sha }}
      - id: client
        name: Publish verified same-release MinIO client index
        uses: docker/build-push-action@v6
        with:
          context: .minio-build-context
          file: .minio-build-context/Dockerfile
          target: minio-client
          platforms: linux/amd64,linux/arm64
          build-args: BASE_IMAGE=${{ steps.inputs.outputs.base_image }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/michaelwclark/genomes-agentic-os-execution-fabric-minio-client:${{ github.sha }}
      - name: Attest current server index
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/michaelwclark/genomes-agentic-os-execution-fabric-minio
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true
      - name: Attest current client index
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/michaelwclark/genomes-agentic-os-execution-fabric-minio-client
          subject-digest: ${{ steps.client.outputs.digest }}
          push-to-registry: true
      - name: Exercise actual published immutable images on both architectures
        env:
          SERVER_IMAGE: ghcr.io/michaelwclark/genomes-agentic-os-execution-fabric-minio@${{ steps.server.outputs.digest }}
          CLIENT_IMAGE: ghcr.io/michaelwclark/genomes-agentic-os-execution-fabric-minio-client@${{ steps.client.outputs.digest }}
        run: |
          for arch in amd64 arm64; do
            python scripts/release/smoke-minio-source-images.py \
              --platform "linux/${arch}" --published \
              --minio-image "${SERVER_IMAGE}" --client-image "${CLIENT_IMAGE}" \
              --namespace "minio-source-${GITHUB_RUN_ID}-${arch}" \
              --output "minio-published-smokes/${arch}.json"
          done
      - name: Verify actual indexes, children and current signed provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_IMAGE: ghcr.io/michaelwclark/genomes-agentic-os-execution-fabric-minio@${{ steps.server.outputs.digest }}
          CLIENT_IMAGE: ghcr.io/michaelwclark/genomes-agentic-os-execution-fabric-minio-client@${{ steps.client.outputs.digest }}
        run: |
          python scripts/release/verify-minio-image-publication.py \
            --minio-image "${SERVER_IMAGE}" --client-image "${CLIENT_IMAGE}" \
            --input-receipt .minio-build-context/build-inputs.json \
            --smoke-dir minio-published-smokes \
            --repository "${GITHUB_REPOSITORY}" --source-sha "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" --output-dir minio-publication-proof
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: minio-source-publication-proof
          include-hidden-files: true
          path: |
            .minio-build-context/build-inputs.json
            minio-published-smokes/*.json
            minio-publication-proof/*
          if-no-files-found: warn

  control-plane-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: services/execution-fabric-control-plane
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-control-plane:${{ needs.validate.outputs.version }}
          platforms: linux/amd64,linux/arm64
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-control-plane
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  witness-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: services/execution-fabric-leadership-witness
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-leadership-witness:${{ needs.validate.outputs.version }}
          platforms: linux/amd64,linux/arm64
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-leadership-witness
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  worker-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/execution-fabric-worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-worker:${{ needs.validate.outputs.version }}
          platforms: linux/amd64,linux/arm64
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/genomes-agentic-os-execution-fabric-worker
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  assets:
    needs: [validate, dependency-images, minio-images, control-plane-image, witness-image, worker-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e . build
      - uses: actions/download-artifact@v7
        with:
          name: minio-source-publication-proof
          path: minio-source-publication-proof
      - name: Build Python distributions and digest-locked portable assets
        run: |
          python -m build
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          python scripts/release/build-execution-fabric-release.py \
            --output-dir dist/release \
            --control-plane-image "ghcr.io/${owner}/genomes-agentic-os-execution-fabric-control-plane@${{ needs.control-plane-image.outputs.digest }}" \
            --witness-image "ghcr.io/${owner}/genomes-agentic-os-execution-fabric-leadership-witness@${{ needs.witness-image.outputs.digest }}" \
            --worker-image "ghcr.io/${owner}/genomes-agentic-os-execution-fabric-worker@${{ needs.worker-image.outputs.digest }}" \
            --postgres-image "${{ needs.dependency-images.outputs.postgres }}" \
            --valkey-image "${{ needs.dependency-images.outputs.valkey }}" \
            --minio-image "${{ needs.minio-images.outputs.minio }}" \
            --minio-client-image "${{ needs.minio-images.outputs.minio_client }}" \
            --minio-publication-receipt minio-source-publication-proof/minio-publication-proof/publication-custody.json
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/release/execution-fabric-sbom.spdx.json
          upload-artifact: false
      - name: Refresh checksums after SBOM
        working-directory: dist/release
        run: |
          cp ../*.whl ../*.tar.gz ./
          rm SHA256SUMS
          checksum_tmp="$(mktemp "${RUNNER_TEMP}/execution-fabric-SHA256SUMS.XXXXXX")"
          trap 'rm -f "${checksum_tmp}"' EXIT
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
            sort -z |
            xargs -0 sha256sum > "${checksum_tmp}"
          mv "${checksum_tmp}" SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: execution-fabric-release-assets
          path: dist/release/*
          if-no-files-found: error

  github-release:
    needs: [validate, assets]
    uses: ./.github/workflows/release-contract.yml
    permissions:
      actions: read
      contents: write
    with:
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ github.ref_name }}
      release_ref: main
      target_sha: ${{ github.sha }}
      tag_mode: verify
      artifact_name: execution-fabric-release-assets
      asset_manifest: |
        execution-fabric-config-schema.tar.gz
        execution-fabric-emergency-bundle.tar.gz
        execution-fabric-image-lock.json
        execution-fabric-release-manifest.json
        execution-fabric-sbom.spdx.json
        genomes_agentic_os-${{ needs.validate.outputs.version }}-py3-none-any.whl
        genomes_agentic_os-${{ needs.validate.outputs.version }}.tar.gz
        SHA256SUMS
