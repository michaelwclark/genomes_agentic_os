name: Release candidate dry run

on:
  pull_request:
    branches: ["release/**"]
    types: [closed]

permissions:
  contents: read

jobs:
  derive:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.semver.outputs.version }}
      release_required: ${{ steps.semver.outputs.release_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - id: semver
        name: Derive and guard the release candidate
        env:
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TARGET_SHA}")"
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/release/derive-semver.py \
            --base-tag "${base_tag}" \
            --target-sha "${TARGET_SHA}" \
            --expected-version "${expected_version}" \
            --major-version-zero
