# SSH identity registry for the Agentic OS.
# Routing policy (harnesses, project_paths, auto_route) lives in
# harness/registries/hosts-routing.yml. This file is SSH-identity only.
#
# Schema: {hosts: {<alias>: {ssh_alias, user, home, description, ssh_options, paths:[]}}}
# The `home` field (added in feat/024) is the path domain root on this host.
# `paths` is optional; used by host add/list CLI and remote_mounts.py.

hosts:
  bigmac:
    ssh_alias: bigmac            # not used for self; documented for symmetry
    user: genome
    home: /Users/genome          # path domain root on this host
    description: Primary laptop; the only host with the installed ~/agentic_os instance.

  genomesbox:
    ssh_alias: genomesbox
    user: genome
    home: /home/genome           # path domain root on this host
    description: Always-on 32-core Linux box; shared memory plane + losmon authoritative.
    ssh_options: ["-o", "ClearAllForwardings=yes"]

  # mac: (add in Phase 4 — same shape as genomesbox but home: /Users/genome)
