schema_version: 1
workspace: Genome's Notion
home_page:
  title: Genomes OS Home
  purpose: Daily operating dashboard and cross-project command center.
project_buckets:
  - Dashboard
  - Specs
  - Worklogs
  - Active Work
  - Automations
  - Workflows
  - Runs
  - PRs
  - Docs
  - Archive
max_root_child_pages: 25
rollups:
  os_signals:
    purpose: Cross-OS rollup with quick links to source databases.
    source_databases:
      - OS Specs
      - OS PRs
      - OS Runs
      - OS Automations
      - OS Worklogs
      - OS Alerts
ideas:
  default_view: grouped_by_project
  notion_bucket: Specs
  filesystem_bucket: work-items/01-intake
backup:
  required_before_moves: true
  local_artifact_root: work-items/02-active/010_notion_os_operations_reorg/artifacts/notion-backup
