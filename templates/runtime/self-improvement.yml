schema_version: 1
enabled: false
schedule_mode: disabled
schedule_target:
  id: self_improvement_review
  enabled: false
  cadence: weekly
  command: agentic-os self-improvement morning-report --root <root> --apply
evidence_roots:
  - path: harness/shared_factory/06-runs-and-logs
    legacy_read_only: false
  - path: harness/shared_factory/05-knowledge
    legacy_read_only: false
  - path: harness/logs
    legacy_read_only: false
  - path: harness/logs/conversations
    legacy_read_only: false
  - path: harness/skills
    legacy_read_only: false
  - path: harness/commands
    legacy_read_only: false
  - path: harness/rules
    legacy_read_only: false
  - path: TOOLS.md
    legacy_read_only: false
  - path: RULES.md
    legacy_read_only: false
  - path: ROUTER.md
    legacy_read_only: false
  - path: shared_factory
    legacy_read_only: true
# Recency window for evidence sampling. Files whose mtime is older than this
# many days are skipped entirely, so stale transcripts and old run logs cannot
# keep regenerating the same proposal forever. Set to 0 (or a negative value)
# to disable the cutoff and scan every file regardless of age.
evidence_max_age_days: 7
external_sources:
  - id: notion_genome
    provider: notion
    mode: report_projection
    token_env: GENOMES_NOTION_PAT
    target: "Genome's Agentic OS / Self Improvement Reports"
  - id: linear_genome
    provider: linear
    mode: readiness_snapshot
    token_env: LINEAR_TOKEN
notion_report:
  parent_title: "Genome's Agentic OS"
  parent_page_id: ""
  reports_page_title: Self Improvement Reports
proposal_thresholds:
  minimum_total: 18
  minimum_confidence: 3
cooldowns:
  skill-draft: 14d
  command-draft: 14d
  workflow-draft: 14d
  automation-draft: 30d
  feature-spec: 30d
redaction:
  replacement: "[REDACTED_SECRET]"
  refuse_token_shaped_values: true
output_paths:
  runs: harness/shared_factory/06-runs-and-logs/self-improvement/runs
  proposals: harness/shared_factory/06-runs-and-logs/self-improvement/proposals
  approvals: harness/shared_factory/06-runs-and-logs/self-improvement/approvals
  drafts: harness/shared_factory/06-runs-and-logs/self-improvement/drafts
promotion_targets:
  - feature-spec
  - skill-draft
  - command-draft
  - workflow-draft
  - tool-wrapper-draft
  - reference-update-plan
  - doctor-check-draft
approval_required: true
# Guarded nightly lane that turns low-risk proposals into queued, executable work.
# Runs after the daily review has produced fresh proposals via
# `agentic-os self-improvement nightly-apply`. Selection is limited to items still
# at promotion_status `proposed` that match the auto_approve policy below; the
# existing approve + promote mechanics are reused (no parallel state store).
# Defaults to disabled on a fresh install; an operator enables it after review.
nightly_apply:
  # Master switch for the nightly-apply lane. When false, `nightly-apply` performs
  # no auto-approval or promotion regardless of the policy below.
  enabled: false
  auto_approve:
    # Only proposals whose recommended_artifact is in this list are eligible for
    # automatic approval. doctor-check-draft is the lowest-risk class: it only
    # ever produces a draft validation/doctor check, never a live surface change.
    classes:
      - doctor-check-draft
    # Minimum proposal score.total required for auto-approval. doctor-check-draft
    # proposals score 20; feature-spec proposals score 19, so a min_score of 20
    # deliberately excludes feature specs from the automatic lane.
    min_score: 20
    # Hard cap on how many proposals the lane will auto-approve + queue per night.
    # Protects against a flood of new findings queuing unbounded work.
    max_per_night: 3
  # Where queued work rows are projected. `work_intake` maps to the 🧭 OS Work
  # Intake Notion database; Notion projection is best-effort and never fails the run.
  queue_target: work_intake
  # Source/provenance tag stamped on notifications and queued rows so operators
  # can trace queued work back to this automated lane.
  notify_source: automation.self_improvement
  # Autonomous implementation lane: per-class feature toggles. When enabled,
  # proposals that were auto-approved + promoted this run and whose class maps
  # to true below are queued straight into the auto_dev execution lane, with a
  # per-improvement on/off switch recorded in self-improvement-toggles.yml.
  # Disabled by default; an operator flips individual classes to true after review.
  auto_implement:
    enabled: false
    # Map of recommended_artifact class -> bool. Only classes explicitly set to
    # true are auto-implemented; everything else stays queued for the operator.
    classes:
      doctor-check-draft: false
      skill-draft: false
      command-draft: false
      workflow-draft: false
      tool-wrapper-draft: false
      reference-update-plan: false
      feature-spec: false
    # Hard cap on auto-implementations queued per nightly run.
    max_per_night: 2
  # Proposals older than this many days that do NOT match the auto_approve policy
  # are surfaced in the run receipt as `stale_triage` for operator visibility.
  # This is visibility only; it never changes proposal state.
  stale_after_days: 7
model_review:
  enabled: false
  sandbox_required: true
