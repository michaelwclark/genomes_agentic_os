backup_policy:
  enabled: true
  include:
    - .agentic_root
    - lib/
    - harness/AGENTS.md
    - harness/artifact-config/
    - harness/ROUTER.md
    - harness/CONTEXT.md
    - harness/RULES.md
    - harness/TOOLS.md
    - harness/bin/
    - harness/commands/
    - harness/investigation-config/
    - harness/registries/
    - harness/reports/
    - harness/rules/
    - harness/skills/
    - harness/shared_factory/00-control-plane/
  exclude:
    - projects/
    - harness/logs/
    - harness/security/ssh/*
    - "**/.env"
    - "**/*secret*"
    - "**/*token*"
  remote:
    name: agentic-os-backup
    url: ""
