id: <chain_rule_id>
display_name: <display_name>
enabled: false
when:
  event_type: <event_type>
  filters: {}
then:
  enqueue:
    work_type: review
    route_to: shared_factory
    workflow: review_event
    context_profile: event_context
    execution_target: codex
    maturity: prepare
approval:
  required: false
limits:
  max_chain_depth: 3
  cooldown: 10_minutes
idempotency:
  key: "{event_idempotency_key}:{rule_id}"
outputs:
  run_queue: shared_factory/00-control-plane/run-queue.yml
  event_log: shared_factory/06-runs-and-logs/events/
