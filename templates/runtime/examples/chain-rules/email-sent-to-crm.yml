id: email_sent_to_crm
display_name: Email sent — queue CRM row insert or update
enabled: false
when:
  event_type: email.message.sent
  filters:
    recipient_domain: <client_domain>
then:
  enqueue:
    work_type: review
    route_to: shared_factory
    workflow: crm_row_upsert
    context_profile: email_context
    execution_target: codex
    maturity: prepare
approval:
  required: true
limits:
  max_chain_depth: 3
  cooldown: 10_minutes
idempotency:
  key: "{event_idempotency_key}:email_sent_to_crm"
outputs:
  run_queue: shared_factory/00-control-plane/run-queue.yml
  event_log: shared_factory/06-runs-and-logs/events/
