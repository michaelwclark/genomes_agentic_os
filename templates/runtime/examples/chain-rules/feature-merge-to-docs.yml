id: feature_merge_to_docs
display_name: Feature merged — queue docs update and release note
enabled: false
when:
  event_type: github.pull_request.merged
  filters:
    base_branch: main
then:
  enqueue:
    work_type: review
    route_to: shared_factory
    workflow: docs_update_and_release_note
    context_profile: pr_context
    execution_target: codex
    maturity: prepare
approval:
  required: false
limits:
  max_chain_depth: 3
  cooldown: 10_minutes
idempotency:
  key: "{event_idempotency_key}:feature_merge_to_docs"
outputs:
  run_queue: shared_factory/00-control-plane/run-queue.yml
  event_log: shared_factory/06-runs-and-logs/events/
