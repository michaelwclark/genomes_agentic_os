id: github_genome
display_name: Genome's GitHub Account
system: github
status: planned
owner: OS Owner
provider_priority:
  - native_mcp
  - composio
  - direct_api
credential_refs:
  env_vars:
    - GITHUB_TOKEN
    - GITHUB_USERNAME
  account_aliases:
    - github_genome
workspace_verification:
  required: true
  expected_workspace: <github_org_or_username>
permissions:
  read:
    - repos
    - pull_requests
    - issues
    - check_suites
    - check_runs
    - commits
    - releases
  write:
    - pull_requests
    - issues
    - issue_comments
    - pr_reviews
approval_required_for:
  - external_message_send
  - customer_visible_output
health_check:
  command: agentic-os connected-system doctor github_genome
