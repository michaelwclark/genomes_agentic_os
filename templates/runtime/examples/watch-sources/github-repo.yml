id: github_main_repo_prs
display_name: GitHub — Main Repository PRs
connected_system: github_genome
source_type: github_repo
external_ref:
  owner: <github_org_or_username>
  repo: <repository_name>
  event_types:
    - pull_request
    - check_suite
watch_method: poll
cadence: every_5_minutes
enabled: false
cursor:
  type: timestamp
  state_ref: shared_factory/00-control-plane/watch-cursors.yml
dedupe:
  idempotency_key: "{source_type}:{owner}:{repo}:{event_type}:{event_id}"
filters:
  event_types:
    - pull_request.merged
    - check_suite.failed
trigger_rules:
  - id: github_pr_merged
    display_name: PR merged to main branch
    enabled: false
    when:
      event_type: github_repo.polled
      fields:
        event_type: pull_request.merged
        base_branch: main
    then:
      emit_event:
        type: github.pull_request.merged
      enqueue:
        work_type: review
        route_to: shared_factory
        context_profile: source_event
        maturity: observe
    approval:
      required: false
    idempotency:
      key: "{source_type}:{owner}:{repo}:{event_type}:{event_id}:github_pr_merged"
  - id: github_ci_failed
    display_name: CI check suite failed
    enabled: false
    when:
      event_type: github_repo.polled
      fields:
        event_type: check_suite.failed
    then:
      emit_event:
        type: github.check_suite.failed
      enqueue:
        work_type: review
        route_to: shared_factory
        context_profile: source_event
        maturity: observe
    approval:
      required: false
    idempotency:
      key: "{source_type}:{owner}:{repo}:{event_type}:{event_id}:github_ci_failed"
route:
  command: agentic-os route
  context_command: agentic-os context build
  fallback_domain: shared_factory
outputs:
  source_events_dir: shared_factory/06-runs-and-logs/source-events/
  run_queue_ref: shared_factory/00-control-plane/run-queue.yml
