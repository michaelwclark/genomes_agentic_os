id: slack_escalations_channel
display_name: Slack — Customer Escalations Channel
connected_system: slack_genome
source_type: slack_channel
external_ref:
  channel_id: <slack_channel_id>
  channel_name: customer-escalations
watch_method: poll
cadence: every_5_minutes
enabled: false
cursor:
  type: event_id
  state_ref: shared_factory/00-control-plane/watch-cursors.yml
dedupe:
  idempotency_key: "{source_type}:{channel_id}:{event_id}"
filters:
  keywords:
    - escalation
    - urgent
    - down
    - blocked
trigger_rules:
  - id: slack_escalation_mentioned
    display_name: Escalation keyword detected in channel
    enabled: false
    when:
      event_type: slack_channel.polled
      fields:
        has_keyword: "true"
    then:
      emit_event:
        type: os.observation
      enqueue:
        work_type: review
        route_to: shared_factory
        context_profile: source_event
        maturity: observe
    approval:
      required: false
    idempotency:
      key: "{source_type}:{channel_id}:{event_id}:slack_escalation_mentioned"
route:
  command: agentic-os route
  context_command: agentic-os context build
  fallback_domain: shared_factory
outputs:
  source_events_dir: shared_factory/06-runs-and-logs/source-events/
  run_queue_ref: shared_factory/00-control-plane/run-queue.yml
