id: codex_profile_manifest
version: 0.1.0
purpose: >
  Agentic OS metadata for Codex config profiles. Use with
  templates/agent-config/codex-profiles.toml.
default_telemetry:
  otel_log_user_prompt: false
  secrets_in_logs: false
merge_rules:
  precedence:
    - active_user_instruction
    - directory_config_toml_profile
    - directory_prompt_files
    - parent_agentic_os_profile
    - global_harness_defaults
  safety: strictest_rule_wins
  mcp_availability: runtime_intersection_with_narrowest_layer
  telemetry: narrower_layers_may_only_restrict
profiles:
  global_user_harness:
    layer: global_harness
    intended_model_behavior: conservative_global_defaults
    skills:
      - skill-discovery
      - memory-refresh
      - shell-hygiene
    prompt_files:
      - AGENTS.md
      - ROUTER.md
      - CONTEXT.md
      - RULES.md
      - TOOLS.md
      - MEMORY.md
    mcp_availability: user-approved global MCPs only
    environment_assumptions:
      - user home directory
      - configured project roots
    logging_telemetry_posture:
      otel_log_user_prompt: false
      notes: Do not log secrets or full prompts.
  agentic_os_root:
    layer: agentic_os_root
    intended_model_behavior: product-source-aware
    skills:
      - build-runner
      - os-doctor
      - workflow-builder
      - run-logger
    prompt_files:
      - AGENTS.md
      - ROUTER.md
      - CONTEXT.md
      - RULES.md
      - TOOLS.md
      - MEMORY.md
    mcp_availability: filesystem, git, and verified Notion control plane
    environment_assumptions:
      - source repository or installed OS root
      - Notion is control plane, not runtime database
    logging_telemetry_posture:
      otel_log_user_prompt: false
      notes: Store run evidence in local logs.
  customer_os_root:
    layer: customer_os_root
    intended_model_behavior: customer-boundary-aware
    skills:
      - customer-validation
      - source-map-review
      - handoff-checks
    prompt_files:
      - AGENTS.md
      - ROUTER.md
      - CONTEXT.md
      - RULES.md
      - TOOLS.md
      - MEMORY.md
      - customer.yml
    mcp_availability: customer-approved systems only
    environment_assumptions:
      - customer OS root
      - approved customer repositories and source systems
    logging_telemetry_posture:
      otel_log_user_prompt: false
      notes: Keep customer-safe summaries only.
  domain_or_lane:
    layer: domain_or_lane
    intended_model_behavior: narrow-routing-and-source-map-aware
    skills:
      - routing
      - context-pack-builder
      - workflow-readiness
      - automation-qualifier
    prompt_files:
      - AGENTS.md
      - CLAUDE.md
      - ROUTER.md
      - CONTEXT.md
      - RULES.md
      - TOOLS.md
      - MEMORY.md
      - domain.yml
    mcp_availability: domain-approved systems only
    environment_assumptions:
      - domain folder
      - linked project, workflow, and automation folders
    logging_telemetry_posture:
      otel_log_user_prompt: false
      notes: Use domain run logs and activity logs.
  project:
    layer: project
    intended_model_behavior: project-source-and-rules-aware
    skills:
      - routing
      - context-pack-builder
      - source-map-review
    prompt_files:
      - AGENTS.md
      - CLAUDE.md
      - ROUTER.md
      - CONTEXT.md
      - RULES.md
      - TOOLS.md
      - MEMORY.md
      - project.yml
      - source-map.md
      - status.md
    mcp_availability: project-approved systems only
    environment_assumptions:
      - project folder under 02-projects
      - optional src symlink to local repository
      - project-local artifacts and worktrees
    logging_telemetry_posture:
      otel_log_user_prompt: false
      notes: Use project status, source map, and linked run logs.
  workflow_or_task:
    layer: workflow_or_task
    intended_model_behavior: acceptance-criteria-driven
    skills:
      - context-pack-builder
      - qa-planning
      - run-closeout
    prompt_files:
      - AGENTS.md
      - CLAUDE.md
      - ROUTER.md
      - CONTEXT.md
      - RULES.md
      - TOOLS.md
      - MEMORY.md
      - workflow.md
      - quick-reference.md
      - context-pack.md
      - runbook.md
    mcp_availability: workflow-approved systems only
    environment_assumptions:
      - workflow folder
      - linked run artifacts
      - linked source systems
    logging_telemetry_posture:
      otel_log_user_prompt: false
      notes: Record validation in run logs.
  automation:
    layer: automation
    intended_model_behavior: guarded-idempotent-runtime-operation
    skills:
      - automation-qualifier
      - runtime-operator
      - integration-setup
    prompt_files:
      - AGENTS.md
      - CLAUDE.md
      - ROUTER.md
      - CONTEXT.md
      - RULES.md
      - TOOLS.md
      - MEMORY.md
      - automation.md
      - permissions.md
      - failure-modes.md
      - tests.md
    mcp_availability: explicit automation contract only
    environment_assumptions:
      - runtime registry
      - automation logs
      - approved connected systems
    logging_telemetry_posture:
      otel_log_user_prompt: false
      notes: Write structured runtime records.
