# Codex profile template for Genome's Agentic OS.
# Keep OS metadata in codex-profile-manifest.yml and generated
# config/codex-profile.yml. Keep durable prompt behavior in the files listed by
# each policy's prompt_files.

[profiles.global_user_harness]
model = "gpt-5.4-mini"
model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[profiles.agentic_os_root]
model = "gpt-5.4-mini"
model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

