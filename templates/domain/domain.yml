id: example_domain
name: Example Domain
owner: OS Owner
status: active

purpose: >
  Describe the operating boundary this domain owns.

lanes:
  - engineering
  - marketing
  - sales
  - support
  - operations
  - finance
  - personal_admin
  - learning

directories:
  control_plane: 00-control-plane
  inbox: 01-inbox
  projects: 02-projects
  workflows: 03-workflows
  automations: 04-automations
  knowledge: 05-knowledge
  runs_and_logs: 06-runs-and-logs
  metrics: 07-metrics
  archive: 08-archive

source_systems:
  - name: Notion
    role: control_plane
    url: ""
  - name: GitHub
    role: code_and_prs
    url: ""

approval_policy:
  external_writes_require_approval: true
  customer_visible_output_requires_approval: true
  production_changes_require_approval: true
  destructive_actions_require_approval: true

notion:
  domain_home_page_id: ""
  inbox_database_id: ""
  work_items_database_id: ""
  runs_database_id: ""
  approvals_database_id: ""

storage:
  active_state: filesystem
  artifacts: filesystem
  cockpit: notion
  memory: agent_memory

context_loading:
  map_file: ROUTER.md
  room_file: CONTEXT.md
  reference_file: REFERENCES.md
  default_rule: read the map and room file first, then load only task-specific references
  skip_by_default:
    - unrelated domains
    - unrelated projects
    - workflow internals unless running that workflow
    - automation logs unless reviewing that automation
