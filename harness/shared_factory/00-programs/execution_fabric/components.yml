schema_version: 1
id: execution_fabric
status: inactive
owner: shared_factory
description: Optional named-queue and worker-pool execution control plane.
commands:
  - id: execution-fabric
    path: harness/commands/os-execution-fabric.md
skills:
  - id: execution-fabric
    path: harness/skills/execution-fabric/SKILL.md
configuration:
  path: config.toml
  queue_catalog: config/queues.yml
  worker_pools: config/worker-pools.yml
  defaults:
    enabled: false
    runtime:
      queue_mode: filesystem
compatibility:
  queue_path: harness/shared_factory/00-control-plane/run-queue.yml
  operator_skill: harness/skills/runtime-operator/SKILL.md
schemas:
  queue_config: schemas/queue-config.schema.json
  worker_pool: schemas/worker-pool.schema.json
  task_envelope: schemas/task-envelope.schema.json
registries:
  - harness/registries/skills.yml
  - harness/skills/skill-registry.yml
  - src/genomes_agentic_os/capability_registry.py
validation:
  - tests/test_cli_scaffold.py
  - tests/test_first_class_registry.py
