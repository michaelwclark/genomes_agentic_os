schema_version: 1
enabled: false
worker_pools:
  - id: codex_workers
    enabled: false
    provider: codex
    queues:
      - codex
    capacity:
      min_workers: 0
      max_workers: 2
      max_tasks_per_worker: 1
    lease:
      timeout_seconds: 1800
      heartbeat_seconds: 60
    retry:
      max_attempts: 3
      backoff_seconds: 60
  - id: claude_workers
    enabled: false
    provider: claude
    queues:
      - claude
    capacity:
      min_workers: 0
      max_workers: 2
      max_tasks_per_worker: 1
    lease:
      timeout_seconds: 1800
      heartbeat_seconds: 60
    retry:
      max_attempts: 3
      backoff_seconds: 60
  - id: non_llm_workers
    enabled: false
    provider: non_llm
    queues:
      - non_llm
    capacity:
      min_workers: 0
      max_workers: 4
      max_tasks_per_worker: 2
    lease:
      timeout_seconds: 900
      heartbeat_seconds: 30
    retry:
      max_attempts: 3
      backoff_seconds: 60
