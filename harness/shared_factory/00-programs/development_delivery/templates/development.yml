version: 1
enabled: true
tracker:
  primary: linear
repository:
  root: /absolute/path/to/canonical/repository
  base_branch: main
  # Multi-repository alternative: remove root/base_branch, set
  # selection_required: true, and declare catalog rows with id/root/base_branch.
  # Per-repository validation or release behavior may be supplied under a row's
  # profile_overrides mapping. `develop start` then requires --repository <id>.
worktrees:
  directory: worktrees
  branch_template: feature/{ticket}-{slug}
work_items:
  active_status: building
# Auto-Dev Health tears down only a runtime explicitly registered here.
# Projects without a per-worktree runtime keep this not-managed declaration.
runtime:
  ownership: not_managed
  provider: none
  identity: not-managed
validation:
  commands:
    - python3 -m pytest tests -q
  test_policy: risk_based_triangle
  ci_fallback_on_environment_failure: true
policies:
  # Omit paths to use the conventional root -> domain -> project folders.
  # Add or remove Markdown files inside a folder; the next run resolves them
  # automatically and records the effective fingerprint.
  dev_standards:
    paths:
      - harness/shared_factory/05-knowledge/dev_standards
      - '{domain_root}/05-knowledge/dev_standards'
      - config/dev_standards
  qa_gates:
    paths:
      - harness/shared_factory/05-knowledge/qa_gates
      - '{domain_root}/05-knowledge/qa_gates'
      - config/qa_gates
  gitflow_topology:
    paths:
      - harness/shared_factory/05-knowledge/gitflow_topology
      - '{domain_root}/05-knowledge/gitflow_topology'
      - config/gitflow_topology
  auto_dev:
    paths:
      - harness/shared_factory/05-knowledge/auto_dev
      - '{domain_root}/05-knowledge/auto_dev'
      - config/auto_dev
  environment_access:
    paths:
      - harness/shared_factory/05-knowledge/environment_access
      - '{domain_root}/05-knowledge/environment_access'
      - config/environment_access
review:
  # Provider-qualified identities that count as "our" pull requests.
  # Keep this synchronized with the account used for provider readback.
  authorship:
    # Domain/project setup fills this with real provider identities.
    # PR-authority stages fail closed while this list is empty.
    ours: []
  opposing_harness:
    required: true
    preferred: claude
    fallback: codex
    unavailable_policy: continue_with_receipt
  copilot:
    require_no_actionable_threads: true
merge:
  policy: never_auto
release:
  fix_version_drives_targets: true
deployment:
  required: false
recovery:
  max_attempts: 3
  lease_minutes: 30
  stale_after_minutes: 45
retention:
  raw_logs_days: 4
  merged_worktree_grace_days: 3
