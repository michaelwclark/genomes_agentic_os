<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Auto-Dev program flow</title>
  <desc id="desc">Signals and ideas flow through investigation and artifact creation into five development delivery stages, with root, domain, and project policy applied throughout.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#93C5FD"/>
    </marker>
    <style>
      .title{font:700 42px Inter,Arial,sans-serif;fill:#F8FAFC}
      .subtitle{font:400 20px Inter,Arial,sans-serif;fill:#CBD5E1}
      .label{font:700 19px Inter,Arial,sans-serif;fill:#F8FAFC}
      .body{font:400 15px Inter,Arial,sans-serif;fill:#DCE7F5}
      .small{font:600 14px Inter,Arial,sans-serif;fill:#BFDBFE;letter-spacing:.06em}
      .line{stroke:#93C5FD;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .soft{stroke:#60A5FA;stroke-width:2;fill:none;stroke-dasharray:8 8}
    </style>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <text x="80" y="82" class="title">Auto-Dev: one polymorphic SDLC</text>
  <text x="80" y="118" class="subtitle">Shared engine • root → domain → project behavior • receipt-backed handoffs</text>

  <g filter="url(#shadow)">
    <rect x="80" y="185" width="230" height="120" rx="22" fill="#334155" stroke="#64748B" stroke-width="2"/>
    <text x="110" y="225" class="small">STARTING SIGNAL</text>
    <text x="110" y="258" class="label">Idea, ticket, QA,</text>
    <text x="110" y="285" class="label">log, alert, comment</text>

    <rect x="390" y="165" width="250" height="160" rx="22" fill="#4338CA" stroke="#818CF8" stroke-width="2"/>
    <text x="420" y="207" class="small">EVIDENCE</text>
    <text x="420" y="242" class="label">Detective</text>
    <text x="420" y="272" class="body">Version-first investigation</text>
    <text x="420" y="296" class="body">Facts, hypotheses, gaps</text>

    <rect x="720" y="165" width="250" height="160" rx="22" fill="#0F766E" stroke="#5EEAD4" stroke-width="2"/>
    <text x="750" y="207" class="small">COMMUNICATION</text>
    <text x="750" y="242" class="label">Create Artifacts</text>
    <text x="750" y="272" class="body">Provider/type contracts</text>
    <text x="750" y="296" class="body">Native render + readback</text>

    <rect x="1050" y="185" width="450" height="120" rx="22" fill="#7C2D12" stroke="#FDBA74" stroke-width="2"/>
    <text x="1080" y="225" class="small">VERIFIED OUTCOME</text>
    <text x="1080" y="258" class="label">Decision, ticket, RCA, or delivery</text>
    <text x="1080" y="285" class="body">Audience-safe artifact with source and readback receipts</text>
  </g>

  <path d="M310 245 H380" class="line"/>
  <path d="M640 245 H710" class="line"/>
  <path d="M970 245 H1040" class="line"/>

  <text x="80" y="405" class="small">DEVELOPMENT DELIVERY ENGINE</text>
  <g filter="url(#shadow)">
    <rect x="80" y="440" width="250" height="145" rx="20" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2"/>
    <text x="110" y="483" class="label">1. Readiness</text>
    <text x="110" y="515" class="body">Claim • criteria • context</text>
    <text x="110" y="540" class="body">risk • executable plan</text>

    <rect x="380" y="440" width="250" height="145" rx="20" fill="#1E40AF" stroke="#60A5FA" stroke-width="2"/>
    <text x="410" y="483" class="label">2. Implement</text>
    <text x="410" y="515" class="body">Isolated worktree • code</text>
    <text x="410" y="540" class="body">tests • local evidence</text>

    <rect x="680" y="440" width="250" height="145" rx="20" fill="#1D4ED8" stroke="#93C5FD" stroke-width="2"/>
    <text x="710" y="483" class="label">3. Review &amp; Repair</text>
    <text x="710" y="515" class="body">Test triangle • PR • CI</text>
    <text x="710" y="540" class="body">review loops • clean gate</text>

    <rect x="980" y="440" width="250" height="145" rx="20" fill="#0369A1" stroke="#7DD3FC" stroke-width="2"/>
    <text x="1010" y="483" class="label">4. Release</text>
    <text x="1010" y="515" class="body">Target matrix • propagation</text>
    <text x="1010" y="540" class="body">branch-correct validation</text>

    <rect x="1280" y="440" width="240" height="145" rx="20" fill="#0E7490" stroke="#67E8F9" stroke-width="2"/>
    <text x="1310" y="483" class="label">5. Closeout</text>
    <text x="1310" y="515" class="body">Merge • deploy • health</text>
    <text x="1310" y="540" class="body">archive • cleanup</text>
  </g>
  <path d="M330 512 H370" class="line"/>
  <path d="M630 512 H670" class="line"/>
  <path d="M930 512 H970" class="line"/>
  <path d="M1230 512 H1270" class="line"/>
  <path d="M515 325 V390 H205 V430" class="soft"/>
  <path d="M845 325 V390 H805 V430" class="soft"/>
  <path d="M1400 430 V350 H1275 V315" class="soft"/>

  <g filter="url(#shadow)">
    <rect x="80" y="675" width="1440" height="140" rx="24" fill="#111827" stroke="#475569" stroke-width="2"/>
    <text x="115" y="717" class="small">DYNAMIC POLICY PLANE — LOADED AND FINGERPRINTED ON EVERY RUN</text>
    <rect x="115" y="746" width="310" height="42" rx="12" fill="#312E81"/><text x="136" y="773" class="body">Root: universal SDLC standards</text>
    <text x="451" y="773" class="label">+</text>
    <rect x="480" y="746" width="310" height="42" rx="12" fill="#115E59"/><text x="501" y="773" class="body">Domain: LOS, Kanga, others</text>
    <text x="816" y="773" class="label">+</text>
    <rect x="845" y="746" width="310" height="42" rx="12" fill="#9A3412"/><text x="866" y="773" class="body">Project: exact code and providers</text>
    <text x="1181" y="773" class="label">+</text>
    <rect x="1210" y="746" width="275" height="42" rx="12" fill="#374151"/><text x="1231" y="773" class="body">Invocation: bounded overlay</text>
  </g>
</svg>
