<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Auto-Dev Detective workflow</title>
  <desc id="desc">A reported signal flows through policy resolution, deployed-version gating, evidence gathering, hypothesis analysis, conclusion, and artifact rendering. VPN or provider unavailability pauses and resumes the same run.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/></marker>
    <style>
      .title{font:700 34px system-ui,sans-serif;fill:#f8fafc}.sub{font:400 17px system-ui,sans-serif;fill:#bfdbfe}.label{font:700 17px system-ui,sans-serif;fill:#f8fafc}.small{font:400 13px system-ui,sans-serif;fill:#dbeafe}.box{fill:#172033;stroke:#60a5fa;stroke-width:2;rx:16;filter:url(#shadow)}.gate{fill:#312e81;stroke:#a5b4fc;stroke-width:2}.pause{fill:#3f1d2e;stroke:#fb7185;stroke-width:2;rx:16}.line{stroke:#93c5fd;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="640" fill="url(#bg)"/>
  <text x="70" y="72" class="title">Auto-Dev Detective</text>
  <text x="70" y="104" class="sub">Version first · evidence over intuition · one resumable run</text>
  <g transform="translate(58 175)">
    <rect class="box" width="170" height="112"/><text x="85" y="42" text-anchor="middle" class="label">Normalize signal</text><text x="85" y="70" text-anchor="middle" class="small">bug · QA · log · alert</text><text x="85" y="90" text-anchor="middle" class="small">scope · tenant · time</text>
  </g>
  <path class="line" d="M228 231 H278"/>
  <g transform="translate(278 175)">
    <rect class="box" width="184" height="112"/><text x="92" y="42" text-anchor="middle" class="label">Resolve policies</text><text x="92" y="70" text-anchor="middle" class="small">root → domain → project</text><text x="92" y="90" text-anchor="middle" class="small">sources + fingerprint</text>
  </g>
  <path class="line" d="M462 231 H512"/>
  <g transform="translate(512 154)">
    <path class="gate" d="M105 0 L210 77 L105 154 L0 77 Z"/><text x="105" y="64" text-anchor="middle" class="label">Deployed</text><text x="105" y="87" text-anchor="middle" class="label">version known?</text><text x="105" y="111" text-anchor="middle" class="small">exact environment authority</text>
  </g>
  <path class="line" d="M722 231 H772"/>
  <g transform="translate(772 175)">
    <rect class="box" width="184" height="112"/><text x="92" y="42" text-anchor="middle" class="label">Gather evidence</text><text x="92" y="70" text-anchor="middle" class="small">local-first · read-only</text><text x="92" y="90" text-anchor="middle" class="small">authority · freshness · gaps</text>
  </g>
  <path class="line" d="M956 231 H1006"/>
  <g transform="translate(1006 175)">
    <rect class="box" width="184" height="112"/><text x="92" y="42" text-anchor="middle" class="label">Test hypotheses</text><text x="92" y="70" text-anchor="middle" class="small">facts · contradictions</text><text x="92" y="90" text-anchor="middle" class="small">falsifiers · confidence</text>
  </g>
  <path class="line" d="M1190 231 H1240"/>
  <g transform="translate(1240 175)">
    <rect class="box" width="150" height="112"/><text x="75" y="42" text-anchor="middle" class="label">Conclude</text><text x="75" y="70" text-anchor="middle" class="small">result + gaps</text><text x="75" y="90" text-anchor="middle" class="small">artifact render</text>
  </g>
  <path d="M617 308 V400 H767" class="line"/>
  <g transform="translate(767 372)">
    <rect class="pause" width="354" height="138"/><text x="177" y="39" text-anchor="middle" class="label">Pause the same run</text><text x="177" y="68" text-anchor="middle" class="small">VPN · environment · provider · authentication</text><text x="177" y="91" text-anchor="middle" class="small">one receipt + explicit resume condition</text><text x="177" y="115" text-anchor="middle" class="small">resume at the prior state; no retry storm</text>
  </g>
  <path d="M1121 441 H1250 V307" class="line"/>
  <text x="70" y="582" class="sub">Receipts: request · policy · source manifest · deployed version · evidence JSONL · hypotheses · events · result · rendered artifact</text>
</svg>
