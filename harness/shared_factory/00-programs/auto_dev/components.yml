policy_planes:
  # These are the five nested Auto-Dev planes. Artifact and investigation
  # contracts are adjacent consumers, not additional development planes.
  auto_dev: harness/shared_factory/05-knowledge/auto_dev
  environment_access: harness/shared_factory/05-knowledge/auto_dev/environment_access
  dev_standards: harness/shared_factory/05-knowledge/auto_dev/dev_standards
  qa_gates: harness/shared_factory/05-knowledge/auto_dev/qa_gates
  gitflow_topology: harness/shared_factory/05-knowledge/auto_dev/gitflow_topology
supporting_contracts:
  artifacts: harness/artifact-config
  investigations: harness/investigation-config
self_hosting_profiles:
  object_library:
    source_repository: michaelwclark/genomes_agentic_lib
    installed_projection: <os-root>/lib
    command: harness/commands/os-library.md
    skill: harness/skills/object-library/SKILL.md
    workflow: ../../04-workflows/auto_dev/library_self_hosting
    stage_mapping:
      develop: build
      qa: validate_exact_artifact
      release: publish
      deploy: install_and_readback
      document_rerun: post_release_documentation
runtime_adapters:
  - id: los_fast_worktree_health
    owner: auto-dev-health
    path: harness/bin/agentic-os-los-fast-worktree-health.py
    config_example: harness/shared_factory/00-programs/auto_dev/config/examples/los/los_app_los_django/development-runtime.yml
    validation: tests/test_los_fast_worktree_health.py
receipts:
  development: <project>/state/development-runs/<run-id>
  artifacts: <work-item-or-run>/artifacts/auto-dev-create-artifacts/<run-id>
  investigations:
    project: <project>/state/investigation-runs/<run-id>
    domain: <domain>/06-runs-and-logs/investigations/<run-id>
    root: harness/shared_factory/06-runs-and-logs/investigations/<run-id>
  schemas:
    auto_dev_work_item: auto-dev-work-item/v1
    auto_dev_stage: auto-dev-stage-evidence/v1
    auto_dev_health: auto-dev-health-evidence/v1
    auto_dev_health_preflight: auto-dev-health-preflight/v1
    auto_dev_runtime_cleanup: auto-dev-runtime-cleanup/v1
    auto_dev_packet_manifest: auto-dev-packet-manifest/v1
    auto_dev_stage_policy_decision: auto-dev-stage-policy-decision/v1
    auto_dev_resource_cleanup: auto-dev-resource-cleanup/v1
    auto_dev_closed_worktree_readback: auto-dev-closed-worktree-readback/v1
    auto_dev_reopen: auto-dev-reopen/v1
    development_stage: development-stage-evidence/v1
    version_authority: investigation-version-authority/v1
    availability: investigation-availability/v1
    investigation_evidence: investigation-evidence/v1
    artifact_approval: artifact-approval/v1
    artifact_target: artifact-target-verification/v1
    artifact_readback: artifact-provider-readback/v1
