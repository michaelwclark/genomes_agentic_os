id: auto_dev_create_artifacts
version: 1
owner: auto_dev
command: /auto-dev-create-artifacts
inputs: [domain, project, provider, artifact_type, evidence, target, authorization]
outputs: [contract_receipt, rendered_artifact, validation_receipt, apply_receipt, readback_receipt]
states: [requested, contract_resolved, evidence_ready, rendered, validated, awaiting_approval, applying, paused, readback_verified, completed, blocked]
steps: [resolve_contract, normalize_evidence, render_provider_payload, validate, verify_target, approve, apply_or_handoff, provider_readback]
validations: [schema_valid, monotonic_safety, required_evidence_verified, semantic_assertions_passed, required_content, external_scrub, target_verified, approval_verified, normalized_live_readback]
failure_modes: [contract_invalid, evidence_missing, validation_failed, unauthorized, provider_unavailable, target_mismatch, readback_mismatch]
events: [artifact.contract.resolved, artifact.rendered, artifact.validated, artifact.apply.requested, artifact.provider.paused, artifact.readback.verified, artifact.completed]
receipts: [evidence.yml, contract-resolution.json, rendered-artifact.json, validation.json, artifact-approval.json, target-verification.json, apply.json, provider-readback.json]
