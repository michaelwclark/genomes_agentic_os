    title: Build Runner
    source_path: harness/skills/build-runner
    installed_path: shared_factory/05-knowledge/skills/build-runner
    harness_targets:
      - codex
      - claude
    status: draft
    builtin: true
    bootstrap: true
    purpose: >
      Drive a Kanban-backed implementation queue through orchestrate with local
      feature artifacts, verified worktree merges, holdout QA, build logs, and
      board writeback.
  - id: automation-qualifier
    title: Automation Qualifier
    source_path: harness/skills/automation-qualifier
    installed_path: shared_factory/05-knowledge/skills/automation-qualifier
    harness_targets:
      - codex
      - claude
    status: active
    builtin: true
    bootstrap: false
    purpose: >
      Decide whether a workflow should become an always-on automation.
  - id: quiet-async-runner
    title: Quiet Async Runner
    source_path: harness/skills/quiet-async-runner
    installed_path: shared_factory/05-knowledge/skills/quiet-async-runner
