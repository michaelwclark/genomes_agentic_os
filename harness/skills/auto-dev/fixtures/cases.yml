      - context_loaded
      - planned
      - worktree_ready
      - implementing
      - local_validation
      - finishing_review
    scenario: human_review
    mode: pre_pr
    reviewer_response: |
      ```json
      []
      ```
      VERDICT: ready
    expect_state: pr_open
    expect_decision: pr_open
    expect_failures: false
    forbid_decision: blocked_identity_unproven
