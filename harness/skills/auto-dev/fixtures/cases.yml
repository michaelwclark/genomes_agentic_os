    spec_source: linear
    workflow_source: linear
    path:
      - claimed
      - context_loaded
      - planned
    expect_state: planned
    expect_decision: planned
    expect_failures: false

  - name: hybrid_jira_linear_blocks_on_product_decision
    tracker_kind: hybrid
    tracker_id: FLYWL-0002
    project: example_hybrid_project
    spec_source: jira
    workflow_source: jira
    personal_todo: linear
    path:
      - claimed
      - context_loaded
      - planned
      - blocked
    expect_state: blocked
    expect_decision: blocked
    expect_failures: false

  - name: ready_for_merge_requires_post_pr_finishing
    tracker_kind: jira
    tracker_id: FLYWL-0003
    project: los_app_los_django
    path:
      - claimed
      - context_loaded
      - planned
      - worktree_ready
      - implementing
      - local_validation
      - finishing_review
      - pr_open
      - ci_watch
      - copilot_watch
      - finishing_review
      - ready_for_merge
    quality_gates:
      ci_green: passed
      copilot: passed
      merge_policy: passed
