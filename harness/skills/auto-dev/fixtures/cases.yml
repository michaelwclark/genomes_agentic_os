schema_version: 2
cases:
  - name: jira_primary_ready_for_merge
    tracker_kind: jira
    tracker_id: FLYWL-0001
    project: los_app_los_django
    path:
      - claimed
      - context_loaded
      - planned
      - worktree_ready
      - implementing
      - local_validation
      - finishing_review
      - pr_open
      - ci_watch
      - copilot_watch
      - finishing_review
      - ready_for_merge
    quality_gates:
      ci_green: passed
      copilot: passed
      merge_policy: passed
      finishing_review: passed
    post_pr_decision: ready_post_pr_checks
    expect_state: ready_for_merge
    expect_decision: ready_for_merge
    expect_failures: false

  - name: linear_primary_contract
    tracker_kind: linear
    tracker_id: LIN-42
