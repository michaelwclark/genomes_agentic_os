# harness-crossreview.schedule.snippet.yml
#
# Scheduling configuration snippet for agentic-os-pr-crossreview.
# This is a SNIPPET only — do not import directly into runtime-registry.yml.
# Add the entries below to runtime-registry.yml manually when scheduling is desired.
#
# Usage: include the `jobs` block below in the appropriate section of runtime-registry.yml.

jobs:
  # Run cross-review on open PRs authored by this account in a target repo.
  # Executes at 09:00 UTC Monday–Friday. Replace <os-root> and owner/repo.
  - id: pr-crossreview-example
    schedule: "0 9 * * 1-5"
    command: >
      <os-root>/harness/bin/agentic-os-pr-crossreview
      --repo owner/repo
      --pr "$(gh pr list --repo owner/repo --author @me --state open --limit 1 --json number --jq '.[0].number' 2>/dev/null || echo '')"
    description: >
      Cross-review the most recent open PR authored by @me in the target repo.
      Skips if no open PRs are found.
    enabled: false  # Set to true to activate; also wire into runtime-registry.yml.
