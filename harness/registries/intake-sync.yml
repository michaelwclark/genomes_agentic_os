# intake-sync.yml - Config for agentic-os-intake-sync
# Sync: OS Work Intake Notion DB -> Linear (Clarks Consulting team)
# See: harness/bin/agentic-os-intake-sync --help

# Linear team (key/name are used by doctor token-visibility remediation labels)
team_id: "2225b211-a962-4392-98ef-b2e78a26669f"
team_key: "CC"
team_name: "Clarks Consulting"

# Notion Project select value -> Linear project id
# (Projects not verified in Clarks Consulting are omitted so no stale projectId is set)
project_map:
  "Agentic OS": "5812f46f-f7a5-4518-8a59-593aaa45f418"
  "Genome's Brain": "1e569341-c390-47e3-a98a-14be82b892e7"
  "Grep Memory Battle": "2be56c7d-77c0-4f60-819d-483d2c171a3b"
  "Kanga": "21bd0219-e5f3-43e7-896c-d5977fbade8b"
  # "Personal" -> no entry -> issues created with no project

# Notion Status -> Linear workflow state NAME
# State IDs are resolved at runtime via team.states GraphQL query.
# 50/50 decision: blocked maps to Todo + a "blocked" label (not a separate state).
# duplicate Linear state type -> Notion "dropped" (see back-sync below).
status_map:
  triaged: "Backlog"
  spec-ready: "Backlog"
  queued: "Todo"
  in-progress: "In Progress"
  blocked: "Todo"
  done: "Done"
  dropped: "Canceled"

# Which Notion statuses to sync forward (Notion -> Linear)
# inbox is excluded by default (sync_inbox: false)
synced_statuses:
  - triaged
  - spec-ready
  - queued
  - in-progress
  - blocked

# If true, also sync rows in "inbox" status (default: false)
sync_inbox: false

# Label configuration
label_map:
  # Always applied to every created issue - marks it as from this intake sync
  always:
    - "aos-intake"

  # Notion Type select value -> Linear label name
  # Reuses existing labels where names match; only "aos-intake" and "blocked" are new.
  # 50/50 decision: using existing "kind:*" prefix labels for idea/spec/plan;
  #   Feature/Bug/Improvement labels exist capitalized - mapping type->Feature etc.
  type_map:
    idea: "kind:idea"
    spec: "kind:spec"
    feature: "Feature"
    plan: "kind:plan"
    bug: "Bug"
    improvement: "Improvement"
    gap: "Improvement"
    investigation: "kind:work-item"

  # Label applied when Notion status is "blocked"
  blocked_label: "blocked"

# Back-sync (Linear -> Notion): when a linked Linear issue reaches completed/canceled
# type, update Notion status:
#   completed -> done
#   canceled / duplicate -> dropped
# (This is handled in the script; config entry here for documentation.)
back_sync:
  completed_to: "done"
  canceled_to: "dropped"
  duplicate_to: "dropped"

# Rows with the "Jira Tracked" checkbox set are execution items owned by the
# Jira/PR dashboards - never mirror them to Linear (prevents double-tracking).
skip_jira_tracked: true
