# intake-routing.yml — NL routing registry for agentic-os-intake-row
# Maps each Project select value to a list of case-insensitive keywords/phrases.
# Tool: harness/bin/agentic-os-intake-row --route-text '<free text>'
#
# Policy: first_match_wins — list more-specific projects BEFORE broader ones.
#   Example: a product codename before a broader program name so the codename
#   keyword wins even when both would match.
#
# Project select values must EXACTLY match the Notion DB options (case-sensitive).
# The entries below are neutral examples: replace "Example Product" with your
# own projects and keep this file in sync with the intake tool's VALID_PROJECTS.

ambiguous_policy: first_match_wins  # order matters; more specific projects listed first

default_project: null  # when no keyword matches, Project property is omitted

project_keywords:

  # Example Product — replace with your own product/project keywords.
  # Match product-specific terms before broader program terms.
  "Example Product":
    - example product
    - example-product
    - exampleproduct

  # Genome's Brain — match before Agentic OS so memory-service phrasing routes here
  "Genome's Brain":
    - genomes brain
    - genome brain
    - genomes-brain
    - memory mcp
    - brain mcp
    - memory write
    - memory read
    - memory_write
    - memory_read

  # Agentic OS — broader OS phrasing after the more specific projects
  "Agentic OS":
    - agentic os
    - agentic_os
    - the os
    - genomes_agentic_os
    - aos
    - harness
    - skill registry
    - os health
    - os doctor
    - os navigator
    - os intake
    - os update

  # Personal
  "Personal":
    - personal
