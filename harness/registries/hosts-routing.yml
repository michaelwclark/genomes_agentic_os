# Routing policy for cross-host work distribution (feat/024).
# SSH identity (ssh_alias, user, ssh_options) lives in config/hosts.yml.
# This file references aliases from hosts.yml — single source of truth for SSH identity.
#
# agentic-harness-run reads this file to resolve --host auto and --host <name>.
# The entries below are neutral examples: replace them with your own hosts,
# project paths, and concurrency limits after installing.

hosts:
  localhost:
    role: primary
    max_concurrent: 4
    harnesses: [claude, gpt]      # CLIs installed locally
    project_paths:                # ProjectName -> absolute path on THIS host
      "Example Product": ~/projects/example-product
    path_rewrite: []              # the primary host is the reference domain; no rewrites needed

  example-host:
    role: worker
    max_concurrent: 2             # conservative default; raise after observing real loads
    harnesses: [claude, gpt]
    project_paths:
      "Example Product": /home/operator/projects/example-product
    path_rewrite:                 # prefix-substitution fallback when project not in project_paths
      - { from: ~/projects, to: /home/operator/projects }

auto_route:
  enabled: false                  # enable after registering real hosts
  strategy: least_active          # fewest in-flight harness runs among eligible hosts
  probe: ssh_pgrep                # one short SSH per candidate host
  probe_pattern: "[c]laude -p|[c]odex exec"  # bracket trick: regex matches real runs but not the pgrep/zsh wrapper's own argv string
  probe_timeout_sec: 6
  on_probe_failure: treat_at_capacity     # fail-safe: never dispatch to an unmeasurable host
  candidate_order: [example-host, localhost]   # tie-break: prefer offloading to a worker first
  fallback_host: localhost

task_overrides:
  # Manual per-task override (read from the intake control plane's Host column)
  notion_host_column: Host        # select on the work-intake DB: auto|<host alias>
  phrase:
    enabled: false
    # Parsed from row body/title (case-insensitive); explicit phrase wins over column.
    # Extend the alternation with your registered host aliases.
    pattern: 'run (?:this )?on (?P<host>localhost|example-host)'
    precedence: [phrase, notion_host_column, auto_route]

artifact_return:
  default: sshfs_visibility       # write on executing host; visible via SSHFS mount on the primary
  sshfs_mounts: {}                # e.g. {example-host: {remote_root: /home/operator/projects, local_root: <os-root>/SSH_example-host/projects}}
  rsync_back:
    enabled: false                # option for hosts without an SSHFS mount
    dest: null                    # e.g. <os-root>/watchers/.../runs/<run-id>

memory_plane:
  shared: false                   # set true when one memory service serves every host
  endpoint_local: 127.0.0.1:3155
  note: "Point every host at one shared memory endpoint before enabling."
