# health-monitor.yml — Agentic OS Health Monitor thresholds
# Read by harness/bin/agentic-os-monitor at startup.
# Edit values here; the monitor picks them up on its next cache refresh (60s).
#
# threshold fields:
#   value  — the limit (integer or boolean)
#   level  — severity when tripped: warn | critical
#
# Notify fires via harness/bin/agentic-os-notify (debounced 30 min per metric).
# State file: harness/shared_factory/06-runs-and-logs/health-monitor-state.json

thresholds:

  # ---- Queue depth -------------------------------------------------------

  # Number of items with status=failed before an alert fires.
  # The run-queue accumulates historical failures; tune once you know your
  # normal baseline. Current queue has ~1176 failed items as of 2026-07-02.
  queue_failed_max:
    value: 1500
    level: warn

  # Number of items with status=queued. A sustained spike means the executor
  # is not consuming work; at 4 000+ something is likely stuck.
  queue_queued_max:
    value: 4000
    level: warn

  # ---- Host vitals --------------------------------------------------------

  # 1-minute load average ceiling per host.
  # bigmac: 10-core M-series; genomesbox: 32-core Linux box.
  # Both hosts alert at the same threshold; tune per-host in a future pass.
  cpu_pct_max:
    value: 90
    level: warn

  # Root filesystem usage percent.
  disk_pct_max:
    value: 90
    level: warn

  # Fire when a host's SSH probe fails (unreachable / timeout).
  # level=warn so genomesbox going to sleep doesn't spam critical.
  host_unreachable:
    value: true
    level: warn

  # ---- Agents per host ---------------------------------------------------

  # Matches max_concurrent from hosts-routing.yml (bigmac:5, genomesbox:3).
  # Set conservatively — a single threshold across all hosts. Raise if you
  # routinely run more than 5 parallel agents on bigmac intentionally.
  agents_max_per_host:
    value: 5
    level: warn
