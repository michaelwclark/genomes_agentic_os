<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">Agentic OS context stitching flow</title>
  <desc id="desc">A flow diagram showing a Jira ticket moving through an Agentic OS root, lending domain routing, Django development context, GitHub PR validation, and QA automation context.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1800" height="1180" fill="#f8fafc"/>
  <rect x="70" y="70" width="1660" height="1040" rx="24" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>

  <text x="120" y="135" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#0f172a">Context stitching across development and QA</text>
  <text x="120" y="182" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#475569">A single prompt routes through small markdown layers, builds a durable feature context pack, and carries it into the QA automation repo.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="120" y="260" width="300" height="128" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <text x="148" y="306" font-size="24" font-weight="700" fill="#0f172a">Prompt</text>
    <text x="148" y="345" font-size="20" fill="#334155">Need to workon Jira</text>
    <text x="148" y="374" font-size="20" font-weight="700" fill="#0f172a">LEND-0000</text>

    <rect x="510" y="248" width="372" height="152" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
    <text x="538" y="295" font-size="24" font-weight="700" fill="#0f172a">Agentic OS root</text>
    <text x="538" y="333" font-size="19" fill="#334155">harness/AGENTS.md + ROUTER.md</text>
    <text x="538" y="361" font-size="19" fill="#334155">TOOLS.md + RULES.md</text>
    <text x="538" y="389" font-size="18" fill="#64748b">project_root_markers = [".agentic_root"]</text>

    <rect x="945" y="248" width="320" height="152" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <text x="973" y="295" font-size="24" font-weight="700" fill="#0f172a">Lending domain</text>
    <text x="973" y="333" font-size="19" fill="#334155">LEND-* routes to lending/</text>
    <text x="973" y="361" font-size="19" fill="#334155">Atlassian MCP reads Jira</text>
    <text x="973" y="389" font-size="18" fill="#64748b">workflow: Django feature to QA</text>

    <rect x="1350" y="248" width="290" height="152" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <text x="1378" y="295" font-size="24" font-weight="700" fill="#0f172a">Django project</text>
    <text x="1378" y="333" font-size="19" fill="#334155">/workon creates context</text>
    <text x="1378" y="361" font-size="19" fill="#334155">branch + implementation</text>
    <text x="1378" y="389" font-size="18" fill="#64748b">lending-app-django/src</text>

    <line x1="420" y1="324" x2="500" y2="324" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="882" y1="324" x2="935" y2="324" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1265" y1="324" x2="1340" y2="324" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="216" y="520" width="470" height="236" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
    <text x="248" y="566" font-size="25" font-weight="700" fill="#0f172a">Django feature context pack</text>
    <text x="248" y="607" font-size="19" fill="#334155">.features/LEND-0000-some-cool-feature/</text>
    <text x="248" y="648" font-size="19" fill="#334155">JIRA.md | SPEC.md | PLAN.md</text>
    <text x="248" y="679" font-size="19" fill="#334155">WORKLOG.md | DECISIONS.md | PR.md</text>
    <text x="248" y="710" font-size="19" fill="#334155">QA_HANDOFF.md | runs/</text>

    <rect x="815" y="520" width="330" height="236" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
    <text x="847" y="566" font-size="25" font-weight="700" fill="#0f172a">GitHub PR</text>
    <text x="847" y="607" font-size="19" fill="#334155">Open pull request</text>
    <text x="847" y="638" font-size="19" fill="#334155">Fix CI and review issues</text>
    <text x="847" y="669" font-size="19" fill="#334155">Use quiet PR watcher</text>
    <text x="847" y="710" font-size="19" font-weight="700" fill="#0f172a">Merged app feature</text>

    <rect x="1275" y="520" width="340" height="236" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
    <text x="1307" y="566" font-size="25" font-weight="700" fill="#0f172a">QA automation repo</text>
    <text x="1307" y="607" font-size="19" fill="#334155">Read Django context first</text>
    <text x="1307" y="638" font-size="19" fill="#334155">Switch to Playwright rules</text>
    <text x="1307" y="669" font-size="19" fill="#334155">Create QA context pack</text>
    <text x="1307" y="710" font-size="18" fill="#64748b">lending-qa-automation/src</text>

    <path d="M1495 400 C1495 458 1495 472 1495 512" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M686 638 C735 638 762 638 805 638" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1145 638 C1190 638 1225 638 1265 638" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1445 520 C1390 460 1328 438 1218 424 C1052 404 848 434 620 520" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
    <text x="825" y="458" font-size="18" fill="#64748b">QA phase stitches back to the original feature context</text>

    <rect x="300" y="900" width="372" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="330" y="944" font-size="23" font-weight="700" fill="#0f172a">Run assets</text>
    <text x="330" y="982" font-size="18" fill="#334155">screenshots, traces, videos, logs</text>

    <rect x="775" y="900" width="330" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="805" y="944" font-size="23" font-weight="700" fill="#0f172a">QA PR</text>
    <text x="805" y="982" font-size="18" fill="#334155">automation script and validation</text>

    <rect x="1210" y="900" width="330" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1240" y="944" font-size="23" font-weight="700" fill="#0f172a">Jira update</text>
    <text x="1240" y="982" font-size="18" fill="#334155">future: cloud run passes first</text>

    <path d="M1398 756 C1335 812 1186 858 1046 898" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1398 756 C1260 844 918 835 598 898" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1452 756 C1470 812 1452 858 1390 898" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="120" y="1080" font-size="20" fill="#475569">Principle: route with small markdown files, preserve feature history in .features/, then switch repo-specific behavior without losing ticket context.</text>
  </g>
</svg>
