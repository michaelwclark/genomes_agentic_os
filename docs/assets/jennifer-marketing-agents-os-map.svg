<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">Jennifer in Marketing Agentic OS map</title>
  <desc id="desc">A layered folder map showing root, marketing domain, campaigns workstream, Beacon campaign run, and durable artifacts controlled by AGENTS.md files.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5 L0,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1800" height="1180" fill="#f8fafc"/>
  <rect x="78" y="70" width="1644" height="1040" rx="28" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="135" y="145" font-size="43" font-weight="700" fill="#0f172a">Build the OS in layers of plain-English instructions</text>
    <text x="135" y="195" font-size="24" fill="#475569">Jennifer in Marketing starts broad, then each folder gives Codex more specific context.</text>

    <rect x="135" y="275" width="250" height="138" rx="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="165" y="324" font-size="26" font-weight="700" fill="#0f172a">OS Root</text>
    <text x="165" y="362" font-size="19" fill="#334155">company-os/</text>
    <text x="165" y="391" font-size="18" fill="#64748b">route to a domain</text>

    <rect x="500" y="275" width="250" height="138" rx="17" fill="#ecfdf5" stroke="#059669" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="530" y="324" font-size="26" font-weight="700" fill="#0f172a">Domain</text>
    <text x="530" y="362" font-size="19" fill="#334155">marketing/</text>
    <text x="530" y="391" font-size="18" fill="#64748b">department context</text>

    <rect x="865" y="275" width="250" height="138" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="895" y="324" font-size="26" font-weight="700" fill="#0f172a">Workstream</text>
    <text x="895" y="362" font-size="19" fill="#334155">campaigns/</text>
    <text x="895" y="391" font-size="18" fill="#64748b">type of work</text>

    <rect x="1230" y="275" width="335" height="138" rx="17" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="1260" y="324" font-size="26" font-weight="700" fill="#0f172a">Run</text>
    <text x="1260" y="362" font-size="19" fill="#334155">beacon-q3-launch/</text>
    <text x="1260" y="391" font-size="18" fill="#64748b">specific campaign package</text>

    <line x1="385" y1="344" x2="488" y2="344" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="750" y1="344" x2="853" y2="344" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1115" y1="344" x2="1218" y2="344" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="135" y="535" font-size="31" font-weight="700" fill="#0f172a">Each layer has its own AGENTS.md</text>
    <text x="135" y="573" font-size="21" fill="#64748b">Top files stay light. Deeper files tell Codex exactly what to read and update.</text>

    <rect x="135" y="625" width="360" height="165" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="168" y="672" font-size="24" font-weight="700" fill="#0f172a">Root AGENTS.md</text>
    <text x="168" y="710" font-size="18" fill="#334155">Task | Location</text>
    <text x="168" y="740" font-size="18" fill="#334155">Marketing -> marketing/</text>
    <text x="168" y="770" font-size="18" fill="#64748b">Only decides where work belongs</text>

    <rect x="555" y="625" width="360" height="165" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="588" y="672" font-size="24" font-weight="700" fill="#0f172a">Domain AGENTS.md</text>
    <text x="588" y="710" font-size="18" fill="#334155">Campaigns -> campaigns/</text>
    <text x="588" y="740" font-size="18" fill="#334155">Content -> content/</text>
    <text x="588" y="770" font-size="18" fill="#64748b">Explains department rules</text>

    <rect x="975" y="625" width="360" height="165" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1008" y="672" font-size="24" font-weight="700" fill="#0f172a">Campaign AGENTS.md</text>
    <text x="1008" y="710" font-size="18" fill="#334155">Read status + worklog</text>
    <text x="1008" y="740" font-size="18" fill="#334155">Use approved claims</text>
    <text x="1008" y="770" font-size="18" fill="#64748b">Controls real work</text>

    <rect x="1395" y="625" width="250" height="165" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="1428" y="672" font-size="24" font-weight="700" fill="#0f172a">Artifacts</text>
    <text x="1428" y="710" font-size="18" fill="#334155">Drafts</text>
    <text x="1428" y="740" font-size="18" fill="#334155">Handoffs</text>
    <text x="1428" y="770" font-size="18" fill="#64748b">Results</text>

    <path d="M260 413 C266 500 285 560 315 615" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
    <path d="M625 413 C640 500 685 560 735 615" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
    <path d="M990 413 C1025 498 1100 560 1155 615" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
    <path d="M1398 413 C1430 505 1488 560 1520 615" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>

    <rect x="250" y="920" width="1300" height="110" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="292" y="964" font-size="25" font-weight="700" fill="#0f172a">The result</text>
    <text x="292" y="1000" font-size="21" fill="#334155">Codex knows what it needs to know, when it needs to know it, and where the next output belongs.</text>
  </g>
</svg>
