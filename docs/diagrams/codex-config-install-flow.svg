<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Codex config install flow</title>
  <desc id="desc">Flow from layer selection through dry-run, apply, backup, doctor validation, and run log closeout.</desc>
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 6; }
      .decision { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; }
      .ok { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 6; }
      .text { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="170" height="80" class="box"/>
  <text x="125" y="83" text-anchor="middle" class="text">Select Layer</text>
  <text x="125" y="108" text-anchor="middle" class="small">root, customer, domain, workflow</text>
  <path d="M210 90 H290" class="arrow"/>
  <rect x="290" y="50" width="170" height="80" class="box"/>
  <text x="375" y="83" text-anchor="middle" class="text">Dry Run</text>
  <text x="375" y="108" text-anchor="middle" class="small">show diff, no writes</text>
  <path d="M460 90 H540" class="arrow"/>
  <polygon points="620,40 710,90 620,140 530,90" class="decision"/>
  <text x="620" y="86" text-anchor="middle" class="text">Conflict?</text>
  <text x="620" y="110" text-anchor="middle" class="small">local value differs</text>
  <path d="M710 90 H790" class="arrow"/>
  <rect x="790" y="50" width="130" height="80" class="box"/>
  <text x="855" y="83" text-anchor="middle" class="text">Apply</text>
  <text x="855" y="108" text-anchor="middle" class="small">write additions</text>
  <path d="M620 140 V210 H540" class="arrow"/>
  <rect x="370" y="180" width="170" height="90" class="box"/>
  <text x="455" y="213" text-anchor="middle" class="text">Confirm + Backup</text>
  <text x="455" y="238" text-anchor="middle" class="small">preserve local value</text>
  <path d="M540 225 H790 V130" class="arrow"/>
  <path d="M855 130 V220" class="arrow"/>
  <rect x="770" y="220" width="170" height="80" class="box"/>
  <text x="855" y="253" text-anchor="middle" class="text">Config Doctor</text>
  <text x="855" y="278" text-anchor="middle" class="small">OTEL + MCP checks</text>
  <path d="M770 260 H650" class="arrow"/>
  <rect x="480" y="220" width="170" height="80" class="ok"/>
  <text x="565" y="253" text-anchor="middle" class="text">Validated</text>
  <text x="565" y="278" text-anchor="middle" class="small">record run evidence</text>
  <path d="M480 260 H320" class="arrow"/>
  <rect x="130" y="220" width="190" height="80" class="ok"/>
  <text x="225" y="253" text-anchor="middle" class="text">Closeout Log</text>
  <text x="225" y="278" text-anchor="middle" class="small">docs, card, build logs</text>
</svg>
