<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Auto-Dev Health lifecycle</title>
  <desc id="desc">After Closeout proves delivery complete and a merged pull request, Health audits ten receipt kinds and the complete packet, writes a resume manifest and immutable preflight, requires fresh exact-runtime readback, reconciles only item-owned local resources, moves the packet to finished, and validates every durable hash.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#123A4A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".38"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#67E8F9"/>
    </marker>
    <style>
      .title{font:700 38px system-ui,-apple-system,sans-serif;fill:#F8FAFC}
      .sub{font:400 18px system-ui,-apple-system,sans-serif;fill:#CFFAFE}
      .eyebrow{font:700 13px system-ui,-apple-system,sans-serif;fill:#A5F3FC;letter-spacing:.1em}
      .heading{font:700 20px system-ui,-apple-system,sans-serif;fill:#FFFFFF}
      .body{font:400 14px system-ui,-apple-system,sans-serif;fill:#E2E8F0}
      .gate{font:700 17px system-ui,-apple-system,sans-serif;fill:#FEF3C7}
      .small{font:600 14px system-ui,-apple-system,sans-serif;fill:#D1FAE5}
      .line{fill:none;stroke:#67E8F9;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="720" rx="30" fill="url(#bg)"/>
  <text x="60" y="64" class="title">Auto-Dev Health</text>
  <text x="60" y="96" class="sub">The final lifecycle stage after Closeout: preserve durable truth, retire only reconstructable local resources.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="130" width="1320" height="76" rx="18" fill="#713F12" stroke="#FBBF24" stroke-width="2"/>
    <text x="86" y="160" class="eyebrow">INPUT FROM CLOSEOUT</text>
    <text x="86" y="188" class="gate">delivery_complete + verified merged pull request + exact merge revision</text>
  </g>

  <path class="line" d="M300 359 H320"/>
  <path class="line" d="M570 359 H590"/>
  <path class="line" d="M840 359 H860"/>
  <path class="line" d="M1110 359 H1130"/>

  <g filter="url(#shadow)">
    <rect x="60" y="260" width="240" height="198" rx="20" fill="#164E63" stroke="#67E8F9" stroke-width="2"/>
    <text x="82" y="292" class="eyebrow">01 · PROVE</text>
    <text x="82" y="328" class="heading">Verify authority</text>
    <text x="82" y="362" class="body">Existing state only</text>
    <text x="82" y="386" class="body">Exact merge revision</text>
    <text x="82" y="410" class="body">No REOPEN or holds</text>
    <text x="82" y="438" class="small">Stop on mismatch</text>

    <rect x="330" y="260" width="240" height="198" rx="20" fill="#155E75" stroke="#67E8F9" stroke-width="2"/>
    <text x="352" y="292" class="eyebrow">02 · AUDIT</text>
    <text x="352" y="328" class="heading">Check receipts</text>
    <text x="352" y="362" class="body">Ten receipt kinds</text>
    <text x="352" y="386" class="body">Full packet manifest</text>
    <text x="352" y="410" class="body">Packet-relative hashes</text>
    <text x="352" y="438" class="small">missing = []</text>

    <rect x="600" y="260" width="240" height="198" rx="20" fill="#0F766E" stroke="#5EEAD4" stroke-width="2"/>
    <text x="622" y="292" class="eyebrow">03 · PRESERVE</text>
    <text x="622" y="328" class="heading">Write resume path</text>
    <text x="622" y="362" class="body">Copy useful evidence</text>
    <text x="622" y="386" class="body">Freeze packet manifest</text>
    <text x="622" y="410" class="body">Record recreation steps</text>
    <text x="622" y="438" class="small">Freeze preflight</text>

    <rect x="870" y="260" width="240" height="198" rx="20" fill="#047857" stroke="#6EE7B7" stroke-width="2"/>
    <text x="892" y="292" class="eyebrow">04 · RECONCILE</text>
    <text x="892" y="328" class="heading">Reconcile resources</text>
    <text x="892" y="362" class="body">Fresh ≤15m runtime proof</text>
    <text x="892" y="386" class="body">Immediate exit-0 readback</text>
    <text x="892" y="410" class="body">Exact two-resource proof</text>
    <text x="892" y="438" class="small">No force, sweep, or global mode</text>

    <rect x="1140" y="260" width="240" height="198" rx="20" fill="#065F46" stroke="#6EE7B7" stroke-width="2"/>
    <text x="1162" y="292" class="eyebrow">05 · FINISH</text>
    <text x="1162" y="328" class="heading">Move + read back</text>
    <text x="1162" y="362" class="body">Packet → 03-complete</text>
    <text x="1162" y="386" class="body">Canonical state finished</text>
    <text x="1162" y="410" class="body">Recheck every durable hash</text>
    <text x="1162" y="438" class="small">Record Health receipt</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="530" width="635" height="124" rx="20" fill="#052E2B" stroke="#34D399" stroke-width="2"/>
    <text x="84" y="562" class="eyebrow">SAFE TERMINAL RESULTS</text>
    <text x="84" y="594" class="heading">removed · absent · not_managed</text>
    <text x="84" y="622" class="body">The durable packet, compact receipts, and resume manifest always survive.</text>

    <rect x="745" y="530" width="635" height="124" rx="20" fill="#451A1A" stroke="#FCA5A5" stroke-width="2"/>
    <text x="769" y="562" class="eyebrow">BLOCK AND KEEP VISIBLE</text>
    <text x="769" y="594" class="heading">missing proof · hold · ambiguous owner · failed removal</text>
    <text x="769" y="622" class="body">Preserve the resource and registry entry; report one exact next action.</text>
  </g>
</svg>
