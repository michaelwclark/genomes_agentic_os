acceptance:
  - projects can declare remote ssh working trees in project.yml sources.remotes without breaking existing project configs
  - a host registry at config/hosts.yml holds alias-only connectivity metadata validated by schema and doctor
  - scaffold materializes remote/<name>/ with managed REMOTE.md and manifest.yml for every declared remote
  - project AGENTS.md and CONTEXT.md state remote authority and the ssh connect path via managed sections
  - sync-remote refreshes manifests with git facts and capped listings, treating unreachable hosts as a warning state with exit 0
  - doctor validates host references, remote marker files, hosts.yml schema, and manifest staleness with no network calls by default
  - no secrets or ssh credentials appear anywhere in the OS tree
  - rollout creates a doctor-clean los/02-projects/losmon room in ~/agentic_os representing genomesbox:/home/genome/projects/losmon
