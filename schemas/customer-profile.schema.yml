$schema: https://json-schema.org/draft/2020-12/schema
title: Customer Agentic OS Profile
type: object
required:
  - customer
properties:
  customer:
    type: object
    required:
      - slug
      - display_name
      - owner
      - approved_domains
    properties:
      slug:
        type: string
        pattern: "^[a-z0-9_]+$"
      display_name:
        type: string
      owner:
        type: string
      notion_workspace:
        type: string
      approved_domains:
        type: array
        items:
          type: string
          pattern: "^[a-z0-9_]+$"
      source_systems:
        type: array
      default_workflows:
        type: array
      default_automations:
        type: array
      approval_policy:
        type: object
additionalProperties: true
